    const probe = Object.assign({}, st, { rows, full: false });
    const v = validate(probe);
    if (v.errs.length) { toast(v.errs[0]); return; }
    st.rows = rows;
    st.full = false;
    commitUpload(a, rows);
  },
  "u-addrow": () => { const st = S.sheet; st.rows.push(st.session === "standings" ? { id: "", pts: "" } : { id: "", pos: "", st: "fin", fl: false, pts: null }); renderSheet(); const b = $(".sheet-b"); if (b) b.scrollTop = b.scrollHeight; },
  "u-rmrow": (a) => { S.sheet.rows.splice(Number(a), 1); renderSheet(); },
  "u-fl": (a) => { S.sheet.rows.forEach((r, i) => { r.fl = i === Number(a); }); },
  "u-save": (a) => commitUpload(a),
  "u-retry-write": () => { const st = S.sheet; const ex = findArticle(S.core.season, st.r, st.session); writeChronicle(st, st.edit && ex ? ex : null); },
  "u-template": async () => {
    const st = S.sheet;
    const art = templateArticle(S.core, roundOf(S.core, st.r), st.session);
    await Store.saveArticle(art).catch(() => null);
    closeSheet();
    openArticle(art.id);
  },

  "gen-previa": (a) => genPrevia(a),
  "art-rewrite": (a) => rewriteArticle(a),
  "art-delete": (a) => openSheet({
    type: "confirm", title: "Borrar noticia", danger: true, text: "La noticia desaparecerá del archivo. Los resultados y el Mundial no cambian.",
    confirm: "Borrar", onConfirm: async () => { await Store.deleteArticle(a).catch(() => null); back(); toast("Noticia borrada"); }
  }),

  "pick-circuit": (a) => { const rd = roundOf(S.core, Number(a)); openSheet({ type: "circuit", r: Number(a), gp: rd ? rd.gp : null }); },
  "pick-gp": (a) => { S.sheet.gp = a; renderSheet(); },
  "circuit-save": async () => {
    const st = S.sheet;
    if (!st.gp) return;
    closeSheet();
    await mutateCore((core) => { roundOf(core, st.r).gp = st.gp; }).catch(() => null);
    toast(`Ronda ${st.r}: ${CIRCUITS[st.gp].name}`);
  },

  "edit-standings": () => openSheet({ type: "standingsEdit", rows: driverTable(S.core).map((r) => ({ id: r.id, pts: r.pts })) }),
  "stand-save": async () => {
    const st = S.sheet;
    const bad = st.rows.find((r) => r.pts === "" || isNaN(Number(String(r.pts).replace(",", "."))));
    if (bad) { toast(`Revisa los puntos de ${fullName(bad.id)}`); return; }
    const rows = st.rows.map((r, i) => ({ id: r.id, pts: Number(String(r.pts).replace(",", ".")), i })).sort((a, b) => b.pts - a.pts || a.i - b.i);
    closeSheet();
    await mutateCore((core) => { applyStandings(core, rows); refreshAchievements(core); }).catch(() => null);
    toast("Puntos oficiales guardados");
  },

  "driver-edit": (a) => { const d = drv(S.core, a); openSheet({ type: "driverEdit", id: a, num: d.num, team: d.team }); },
  "driver-save": async () => {
    const st = S.sheet;
    const raw = String(st.num == null ? "" : st.num).trim();
    const num = raw === "" ? null : Number(raw);
    if (num !== null && (!Number.isInteger(num) || num < 1 || num > 99)) { toast("El dorsal debe ir del 1 al 99"); return; }
    const clash = num !== null && DRIVER_IDS.find((d) => d !== st.id && drv(S.core, d).num === num);
    if (clash) { toast(`El ${num} ya lo lleva ${fullName(clash)}`); return; }
    closeSheet();
    await mutateCore((core) => { core.roster[st.id] = { team: st.team, num }; }).catch(() => null);
    toast("Ficha actualizada");
  },

  "edit-session": (a) => { const [s, r] = String(a).split(":"); openEntry({ session: s, r: Number(r) }); },
  "e-pick": (a) => {
    const st = S.sheet;
    if (st.mode === "out" && st.session !== "quali") st.out.push({ id: a, st: "dnf" });
    else if (st.target != null) { st.order[st.target] = a; st.target = null; }
    else st.order.push(a);
    renderSheet();
  },
  "e-target": (a) => { const st = S.sheet; const i = Number(a); st.target = st.target === i ? null : i; st.mode = "pos"; renderSheet(); const b = $(".sheet-b"); if (b && b.scrollTo && st.target != null) b.scrollTo({ top: 0, behavior: "smooth" }); },
  "e-slot": (a) => {
    const st = S.sheet;
    const i = Number(a);
    const id = st.order[i];
    if (id) { st.order[i] = null; if (st.fl === id) st.fl = null; } else { st.order.splice(i, 1); st.target = null; }
    trimOrder(st);
    if (st.target != null && st.target >= st.order.length) st.target = null;
    renderSheet();
  },
  "e-up": (a) => { const st = S.sheet; const i = Number(a); if (i > 0) { [st.order[i - 1], st.order[i]] = [st.order[i], st.order[i - 1]]; st.target = null; renderSheet(); } },
  "e-down": (a) => { const st = S.sheet; const i = Number(a); if (i < st.order.length - 1) { [st.order[i + 1], st.order[i]] = [st.order[i], st.order[i + 1]]; st.target = null; renderSheet(); } },
  "e-fl": (a) => { const st = S.sheet; const id = st.order[Number(a)]; st.fl = st.fl === id ? null : id; renderSheet(); },
  "e-mode": (a) => { const st = S.sheet; st.mode = a; st.target = null; renderSheet(); },
  "e-outst": (a) => { const o = S.sheet.out.find((x) => x.id === a); if (o) { o.st = { dnf: "dsq", dsq: "dns", dns: "dnf" }[o.st] || "dnf"; renderSheet(); } },
  "e-outrm": (a) => { const st = S.sheet; st.out = st.out.filter((x) => x.id !== a); renderSheet(); },
  "e-undo": () => {
    const st = S.sheet;
    if (st.target != null) st.target = null;
    else if (st.mode === "out" && st.out.length) st.out.pop();
    else if (st.order.length) { const id = st.order.pop(); if (id && st.fl === id) st.fl = null; trimOrder(st); }
    else st.out.pop();
    renderSheet();
  },
  "e-mom": (a) => {
    const st = S.sheet;
    st.mom = st.mom || {};
    const d = MOMENTS.race.concat(MOMENTS.quali).find((x) => x.id === a);
    if (a in st.mom) delete st.mom[a]; else st.mom[a] = d && d.pick ? d.def || "" : true;
    renderSheet();
  },
  "e-reset": () => { Object.assign(S.sheet, { order: [], out: [], fl: null, target: null }); renderSheet(); },
  "e-grid": () => {
    const st = S.sheet;
    const q = roundOf(S.core, st.r).quali;
    const order = [];
    Object.entries(q.res).forEach(([id, p]) => { order[p - 1] = id; });
    st.order = Array.from({ length: order.length }, (_, i) => order[i] || null);
    renderSheet();
  },
  "e-save": (a) => commitEntry(a),
  "close-season": () => confirmCloseSeason(),
  "confirm-ok": () => {
    const st = S.sheet;
    if (st.typed && String(st.typedValue || "").trim().toUpperCase() !== st.typed) { toast(`Escribe ${st.typed} para confirmar`); return; }
    const fn = st.onConfirm;
    closeSheet();
    if (fn) fn();
  },
  "open-season": (a) => openSheet({ type: "season", season: Number(a) }),
  export: () => exportBackup(),
  "open-restore": () => openSheet({ type: "restore", text: "", error: "" }),
  "restore-go": () => doRestore(),
  "reset-all": () => confirmReset(),
  "start-blank": async () => { S.core = blankCore(1); await Store.saveCore().catch(() => null); toast("Temporada 1 creada"); }
};

Object.assign(ACTIONS, CAREER_ACTIONS, {
  "goto-inbox": () => { S.nav.tab = "me"; S.nav.stacks.me = [{ screen: "inbox", arg: "" }]; S.anim = "enter"; render(); window.scrollTo(0, 0); }
});
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el.dataset.arg, el, e);
});
document.addEventListener("input", (e) => { if (e.target.dataset && e.target.dataset.bind) bindValue(e.target); });
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.matches("[data-files]")) { addFiles(el.files); el.value = ""; return; }
  if (el.matches("[data-restore-file]")) { readRestoreFile(el.files && el.files[0]); return; }
  if (el.matches("[data-photos]")) { addPhotos(el.dataset.photos, el.files); el.value = ""; return; }
  if (el.matches("[data-jump]") && S.sheet && S.sheet.type === "entry") {
    const st = S.sheet;
    const n = Number(el.value);
    while (st.order.length < n - 1) st.order.push(null);
    renderSheet();
    return;
  }
  if (el.dataset && el.dataset.bind) { bindValue(el); if (el.hasAttribute("data-rerender")) renderSheet(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.sheet && !sheetBusy()) closeSheet(); });

/* Semáforos de salida: una vez por sesión, se puede saltar. */
function splash() {
  let seen = false;
  try { seen = sessionStorage.getItem("paddock.splash") === "1"; sessionStorage.setItem("paddock.splash", "1"); } catch (e) { /* sin almacenamiento */ }
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (seen || reduce) return;
  const el = document.createElement("div");
  el.className = "splash";
  el.setAttribute("aria-hidden", "true");
  el.innerHTML = `<div class="rig">${'<div class="col"><i></i><i></i></div>'.repeat(5)}</div>
<span class="wordmark"><span class="slashes"><i></i><i></i><i></i></span>PADDOCK</span><span class="tapskip">Toca para saltar</span>`;
  document.body.appendChild(el);
  const cols = el.querySelectorAll(".col");
  let i = 0, done = false, hold = null;
  const finish = () => {
    if (done) return;
    done = true;
    clearInterval(t);
    clearTimeout(hold);
    cols.forEach((c) => c.classList.remove("on"));
    el.classList.add("out");
    setTimeout(() => el.remove(), 420);
  };
  const t = setInterval(() => {
    if (i < cols.length) cols[i++].classList.add("on");
    else { clearInterval(t); hold = setTimeout(finish, 350 + Math.random() * 450); }
  }, 300);
  el.addEventListener("click", finish);
}

splash();
render();
Store.init();

</script>
