function describeSession(core, round, kind) {
  const lines = [];
  if (kind === "quali" && round.quali) {
    const rows = Object.entries(round.quali.res).sort((a, b) => a[1] - b[1]);
    rows.forEach(([d, p]) => lines.push(`P${p} ${roleName(core, d)}`));
    if (!round.quali.full) lines.push("(Solo se conocen estas posiciones de la clasificación.)");
  }
  const src = kind === "sprint" ? round.sprint : round.race;
  if ((kind === "race" || kind === "sprint") && src) {
    const rows = Object.entries(src.res).sort((a, b) => (a[1].pos ?? 99) - (b[1].pos ?? 99));
    rows.forEach(([d, x]) => {
      const st = finished(x) ? `P${x.pos}` : x.st.toUpperCase();
      lines.push(`${st} ${roleName(core, d)}${x.fl ? " (vuelta rápida)" : ""}${x.pts ? ` +${x.pts} pts` : ""}${x.grid ? `, salió P${x.grid}` : ""}`);
    });
    if (!src.full) lines.push("(Solo se conocen estos resultados de la carrera.)");
    if (round.quali && round.quali.res[ME]) lines.push(`Arévalo había clasificado P${round.quali.res[ME]}.`);
  }
  return lines.join("\n");
}

async function aiExtract(core, session, files, signal) {
  const prompt = extractionPrompt(core, session, files.length);
  const out = await S.ai.json(prompt, { images: files, modelTier: "default", cache: false, signal });
  return cleanExtraction(out, session);
}

function cleanExtraction(out, session) {
  const o = out && typeof out === "object" ? out : {};
  const valid = (id) => (id && DRIVERS[id] ? id : null);
  const st = (s) => { s = String(s || "").toLowerCase(); if (["dnf", "ret", "nc"].includes(s)) return "dnf"; if (s === "dsq") return "dsq"; if (s === "dns") return "dns"; return "fin"; };
  const num = (v) => (v == null || v === "" || isNaN(Number(v)) ? null : Number(v));
  const rows = Array.isArray(o.rows) ? o.rows.map((x) => ({
    pos: num(x.pos), id: valid(x.driverId), st: st(x.status), grid: num(x.grid), fl: x.fastestLap === true, pts: num(x.points)
  })) : [];
  const standings = Array.isArray(o.standings) ? o.standings.map((x) => ({ id: valid(x.driverId), pts: num(x.points) })) : [];
  const seen = new Set();
  const dedupe = (arr) => arr.filter((x) => { if (!x.id) return true; if (seen.has(x.id)) return false; seen.add(x.id); return true; });
  return {
    detected: String(o.detectedSession || session),
    rows: dedupe(rows).sort((a, b) => (a.pos ?? 99) - (b.pos ?? 99)),
    standings: (seen.clear(), dedupe(standings)),
    confidence: String(o.confidence || ""),
    notes: String(o.notes || "")
  };
}

/* Normaliza la respuesta de la IA a un artículo de la app. */
function makeArticle(core, round, kind, raw, extra) {
  const o = raw && typeof raw === "object" ? raw : {};
  const arr = (v) => (Array.isArray(v) ? v : []);
  const str = (v, n) => String(v == null ? "" : v).slice(0, n || 4000);
  const now = Date.now();
  return Object.assign({
    id: `s${core.season}-r${round ? round.r : 0}-${kind}-${now.toString(36)}`,
    season: core.season,
    r: round ? round.r : null,
    gp: round ? round.gp : null,
    kind,
    t: now,
    ai: !!raw,
    kicker: str(o.kicker, 40) || KIND_LABEL[kind],
    title: str(o.title, 120) || "SIN TITULAR",
    subtitle: str(o.subtitle, 400),
    sections: arr(o.sections).slice(0, 8).map((s) => ({ heading: str(s && s.heading, 80), body: str(s && s.body, 5000) })).filter((s) => s.body),
    interviews: arr(o.interviews).slice(0, 8).map((q) => ({ speaker: str(q && q.speaker, 60), team: TEAMS[q && q.team] ? q.team : null, by: MEDIA[q && q.by] ? q.by : null, q: str(q && q.q, 400), a: str(q && q.a, 1500) })).filter((q) => q.a),
    frontPages: normFrontPages(o.frontPages),
    social: normSocial(o.social),
    trending: arr(o.trending).slice(0, 8).map((t) => ({ tag: "#" + str(t && t.tag, 40).replace(/^#+/, "").replace(/\s+/g, ""), posts: Math.max(0, Math.round(Number(t && t.posts) || 0)) })).filter((t) => t.tag.length > 1),
    column: o.column && typeof o.column === "object" && o.column.body ? { outlet: MEDIA[o.column.outlet] ? o.column.outlet : "cronometro", title: str(o.column.title, 140), body: str(o.column.body, 4000) } : null,
    headlines: arr(o.headlines).slice(0, 8).map((h) => str(h, 140)).filter(Boolean),
    radio: arr(o.radio).slice(0, 5).map((h) => str(h, 300)).filter(Boolean),
    stats: statsSnapshot(core, kind)
  }, extra || {});
}

function normFrontPages(v) {
  const str = (x, n) => String(x == null ? "" : x).slice(0, n);
  const seen = new Set();
  return (Array.isArray(v) ? v : []).map((f) => f && typeof f === "object" ? {
    outlet: MEDIA[f.outlet] ? f.outlet : null, headline: str(f.headline, 140), es: MEDIA[f.outlet] && MEDIA[f.outlet].lang !== "es" ? str(f.es, 160) : "",
    deck: str(f.deck, 220), focus: DRIVERS[f.focus] ? f.focus : null
  } : null).filter((f) => f && f.outlet && f.headline && !seen.has(f.outlet) && seen.add(f.outlet)).slice(0, 7);
}
function normSocial(v) {
  const str = (x, n) => String(x == null ? "" : x).slice(0, n);
  const num = (x) => Math.max(0, Math.round(Number(x) || 0));
  return (Array.isArray(v) ? v : []).map((p) => {
    if (!p || typeof p !== "object" || !p.text) return null;
    const who = ["driver", "team", "journalist", "fan"].includes(p.who) ? p.who : "fan";
    const ok = (who === "driver" && DRIVERS[p.id]) || (who === "team" && TEAMS[p.id]) || (who === "journalist" && MEDIA[p.id]) || who === "fan";
    if (!ok) return null;
    const post = { who, id: who === "fan" ? null : p.id, text: str(p.text, 320), likes: num(p.likes), reposts: num(p.reposts), replies: num(p.replies) };
    if (who === "fan") {
      post.name = str(p.name, 40) || "Aficionado";
      post.handle = str(p.handle, 30).toLowerCase().replace(/^@/, "").replace(/[^a-z0-9_]/g, "") || "fan_f1";
    }
    return post;
  }).filter(Boolean).slice(0, 16);
}

/* Aplica rivalidades e hilo narrativo devueltos por la IA. */
function absorbNarrative(core, raw) {
  if (!raw || typeof raw !== "object") return;
  if (raw.storyline && typeof raw.storyline === "string") core.narrative.storyline = raw.storyline.slice(0, 1500);
  if (Array.isArray(raw.rivalries)) {
    const list = (core.narrative.rivalries || []).slice();
    raw.rivalries.forEach((x) => {
      if (!x || !DRIVERS[x.a] || !DRIVERS[x.b] || x.a === x.b) return;
      const heat = Math.max(0, Math.min(100, Math.round(Number(x.heat) || 0)));
      const i = list.findIndex((y) => (y.a === x.a && y.b === x.b) || (y.a === x.b && y.b === x.a));
      const item = { a: x.a, b: x.b, heat, note: String(x.note || "").slice(0, 240) };
      if (i >= 0) list[i] = item; else list.push(item);
    });
    core.narrative.rivalries = list.sort((a, b) => b.heat - a.heat).slice(0, 8);
  }
}

/* Foto fija de las estadísticas en el momento de publicar. */
function statsSnapshot(core, kind) {
  const s = seasonStats(core, ME);
  const c = careerStats(core, S.seasons, ME);
  const table = driverTable(core);
  const mate = teammatesOf(core, ME)[0];
  const top = table.slice(0, 5).map((x) => ({ id: x.id, pos: x.pos, pts: x.pts }));
  if (mate && !top.find((x) => x.id === mate)) { const m = table.find((x) => x.id === mate); top.push({ id: m.id, pos: m.pos, pts: m.pts }); }
  if (!top.find((x) => x.id === ME)) { const m = table.find((x) => x.id === ME); top.push({ id: m.id, pos: m.pos, pts: m.pts }); }
  return {
    kind,
    me: { pos: driverPos(core, ME), pts: s.pts, races: s.races, wins: s.wins, poles: s.poles, podiums: s.podiums, p2: s.p2, p3: s.p3, dnf: s.dnf, fl: s.fl, winStreak: c.winStreak.cur, poleStreak: c.poleStreak.cur },
    drivers: top,
    teams: teamTable(core).slice(0, 4).map((x) => ({ id: x.id, pos: x.pos, pts: x.pts })),
    stale: !!core.stale
  };
}

  const c = circuit(round.gp);
  const where = c ? c.name.toUpperCase() : "LA RONDA " + round.r;
  const gpName = c ? c.gp : "Gran Premio";

  const sections = [];

  if (kind === "quali") {

    const q = res[ME];
    const at = (p) => Object.keys(res).find((d) => res[d] === p);
    const pole = at(1);
    title = q === 1 ? `¡POLE DE ARÉVALO EN ${where}!` : q ? `ARÉVALO SALDRÁ P${q} EN ${where}` : `CLASIFICACIÓN EN ${where}`;
    subtitle = q === 1 ? "El piloto de Aurelia arrancará desde la primera posición." : pole ? `La pole fue para ${nm(pole)}.` : "";
    const lines = [];
    if (q) lines.push(q === 1 ? `Andrés Arévalo firmó la pole position del ${gpName}.` : `Andrés Arévalo clasificó en la ${q}.ª posición del ${gpName}.`);
    if (pole && pole !== ME) lines.push(`La pole fue para ${nm(pole)} (${tn(pole)}).`);
    const front = [1, 2, 3].map((p) => [p, at(p)]).filter(([, d]) => d);
    if (front.length >= 2) lines.push(`Las primeras posiciones de la parrilla: ${front.map(([p, d]) => `P${p} ${DRIVERS[d].last}`).join(", ")}.`);
    sections.push({ heading: "⏱️ Clasificación", body: lines.join("\n\n") || "Clasificación registrada." });
    if (mate && res[mate]) {
      const h = headToHead(core.rounds, ME, mate);
      sections.push({ heading: "🏎️ En Aurelia", body: `${nm(mate)} saldrá P${res[mate]}${q ? (q < res[mate] ? ", por detrás de su compañero" : ", por delante de su compañero") : ""}.` + (h.q.a + h.q.b ? `\n\nDuelo de sábados esta temporada: Arévalo ${h.q.a}, ${DRIVERS[mate].last} ${h.q.b}.` : "") });
    }
  } else if (kind === "previa") {
    title = `PREVIA: ${where}`;
    subtitle = `Ronda ${round.r} de ${core.totalRounds}.`;
    sections.push({ heading: "🏎️ El circuito", body: c ? c.note : "Circuito por anunciar." });
  } else {
    const src = kind === "sprint" ? round.sprint : round.race;
    const res = (src && src.res) || {};
    const x = res[ME];
    const g = kind === "sprint" ? null : gridOf(round, ME);
    const tag = kind === "sprint" ? "EL SPRINT DE " : "";
    if (finished(x) && x.pos === 1) title = `¡ARÉVALO GANA ${tag || "EN "}${where}!`;
    else if (finished(x)) title = `ARÉVALO, P${x.pos} EN ${tag}${where}`;
    else title = `ABANDONO DE ARÉVALO EN ${tag}${where}`;
    subtitle = finished(x) ? `Arévalo cruzó la meta en ${x.pos}.ª posición${x.pts ? ` y suma ${fmt(x.pts)} puntos` : ""}.` : "El piloto de Aurelia no pudo terminar.";
    const lines = [];
    const what = kind === "sprint" ? "el sprint" : "el " + gpName;
    if (finished(x)) lines.push(`Andrés Arévalo ${x.pos === 1 ? "ganó" : `terminó ${x.pos}.º en`} ${what}${g ? `, tras salir desde la ${g}.ª posición` : ""}${x.pts ? `, y se lleva ${fmt(x.pts)} puntos` : ""}.`);
    else if (x) lines.push(`Andrés Arévalo no terminó ${what} (${String(x.st).toUpperCase()}).`);
    const flId = Object.keys(res).find((d) => res[d].fl === true);
    if (flId === ME) lines.push("Además, se llevó la vuelta rápida. ⏱️");
    else if (flId) lines.push(`La vuelta rápida fue para ${nm(flId)}.`);
    const pod = [1, 2, 3].map((p) => [p, Object.keys(res).find((d) => finished(res[d]) && res[d].pos === p)]).filter(([, d]) => d);
    if (pod.length) lines.push(`Podio: ${pod.map(([p, d]) => `${p}.º ${nm(d)} (${tn(d)})`).join(", ")}.`);
    const outs = Object.keys(res).filter((d) => d !== ME && !finished(res[d]));
    if (outs.length) lines.push(`No terminaron: ${outs.map((d) => `${nm(d)} (${String(res[d].st).toUpperCase()})`).join(", ")}.`);
    sections.push({ heading: "🏁 Resultado", body: lines.join("\n\n") || "Resultado registrado." });
    if (mate && res[mate]) {
      const m = res[mate];
      const h = headToHead(core.rounds, ME, mate);
      sections.push({ heading: "🏎️ En Aurelia", body: `${nm(mate)} ${finished(m) ? `terminó ${m.pos}.º` : "no terminó"}${finished(m) && finished(x) ? (x.pos < m.pos ? ", por detrás de Arévalo" : ", por delante de Arévalo") : ""}.` + (h.r.a + h.r.b ? `\n\nCara a cara en carrera esta temporada: Arévalo ${h.r.a}, ${DRIVERS[mate].last} ${h.r.b}.` : "") });
    }
    if (kind === "race") {
      const t = driverTable(core);
      const me = t.find((r) => r.id === ME);
      const lead = t[0], second = t[1];
      let ml = `Arévalo es ${me.pos}.º del Mundial con ${fmt(me.pts)} puntos`;
      ml += me.pos === 1 ? `, ${fmt(me.pts - second.pts)} más que ${nm(second.id)}.` : `, a ${fmt(lead.pts - me.pts)} del líder, ${nm(lead.id)}.`;
      const tp = teamTable(core).find((r) => r.id === teamOf(core, ME));
      if (tp) ml += `\n\n${team(tp.id).name} es ${tp.pos}.º en el Mundial de Constructores con ${fmt(tp.pts)} puntos.`;
      if (core.stale) ml += "\n\nFaltan por sumar los puntos del resto de la parrilla.";
      const cs = careerStats(core, S.seasons, ME);
      if (cs.winStreak.cur >= 2) ml += `\n\n🔥 Lleva ${cs.winStreak.cur} victorias seguidas.`;
      else if (cs.podiumStreak.cur >= 3) ml += `\n\n🔥 Lleva ${cs.podiumStreak.cur} podios seguidos.`;
      sections.push({ heading: "📈 El Mundial", body: ml });
    }
  }
  return makeArticle(core, round, kind, null, {
    kicker: KIND_LABEL[kind], title, subtitle, sections,
    interviews: [], headlines: [], radio: [], auto: true
  });
}

/* ============================================================
   REDACCIÓN AUTOMÁTICA (sin IA)
   Todo lo deportivo sale de los datos anotados. Solo se inventa
   lo narrativo: declaraciones, rumores, opiniones y redes.
   ============================================================ */
function newsRng(seed) {
  let h = 1779033703 ^ seed.length;
  for (let i = 0; i < seed.length; i++) { h = Math.imul(h ^ seed.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
}
const GP_TAG = { aus: "AusGP", chn: "ChineseGP", jpn: "JapaneseGP", bhr: "BahrainGP", sau: "SaudiArabianGP", mia: "MiamiGP", emi: "ImolaGP", mon: "MonacoGP", esp: "SpanishGP", can: "CanadianGP", aut: "AustrianGP", gbr: "BritishGP", bel: "BelgianGP", hun: "HungarianGP", ned: "DutchGP", ita: "ItalianGP", aze: "AzerbaijanGP", sgp: "SingaporeGP", usa: "USGP", mex: "MexicoGP", bra: "BrazilGP", las: "LasVegasGP", qat: "QatarGP", abu: "AbuDhabiGP", gbr_r: "BritishGP", aut_r: "AustrianGP", ned_r: "DutchGP" };
const NAT_OUTLET = { "España": "cronometro", "Italia": "rettilineo", "Reino Unido": "pitwall", "Brasil": "folha", "Francia": "chicane", "Países Bajos": "circuit" };
const HOME_GP = { esp: ["España"], ita: ["Italia"], emi: ["Italia"], gbr: ["Reino Unido"], gbr_r: ["Reino Unido"], bra: ["Brasil"], ned: ["Países Bajos"], ned_r: ["Países Bajos"], mon: ["Mónaco"], jpn: ["Japón"], aus: ["Australia"], can: ["Canadá"], mex: ["México"], usa: ["Estados Unidos"], mia: ["Estados Unidos"], las: ["Estados Unidos"] };
const ROOKIES = ["arevalo", "antonelli", "bearman", "hadjar", "bortoleto", "lawson", "colapinto"];
const BIG_TEAMS = ["redbull", "ferrari", "mercedes", "mclaren"];

const AURELIA_BOSS = "Marco Valenti";

/* ---------- utilidades ---------- */
function NG(core, round, kind, salt) {
  const R = newsRng(`${core.season}|${round ? round.r : 0}|${kind}|${salt || ""}`);
  const g = {
    R,
    pick: (a) => a[Math.floor(R() * a.length)],
    int: (a, b) => Math.round(a + R() * (b - a)),
    shuffle: (a) => { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; },
    fill: (s, v) => String(s).replace(/\{(\w+)\}/g, (_, k) => (v[k] != null ? v[k] : ""))
  };
  return g;
}
const LN = (id) => (DRIVERS[id] ? DRIVERS[id].last : id);
const UP = (s) => String(s).toUpperCase();
const TNAME = (core, id) => team(teamOf(core, id)).name;
function outcome(x) {
  if (!x) return "unknown";
  if (!finished(x)) return x.st === "dsq" ? "dsq" : "dnf";
  if (x.pos === 1) return "win";
  if (x.pos <= 3) return "podium";
  if (x.pos <= 10) return "points";
  return "nopoints";
}
function raceCtx(core, round, kind) {
  const src = kind === "sprint" ? round.sprint : round.race;
  const res = (src && src.res) || {};
  const fin = Object.entries(res).filter(([, x]) => finished(x)).map(([id, x]) => Object.assign({ id }, x)).sort((a, b) => a.pos - b.pos);
  const at = (p) => (fin.find((f) => f.pos === p) || {}).id || null;
  const c = circuit(round.gp);
  const table = driverTable(core);
  const mate = teammatesOf(core, ME)[0] || null;
  const left = core.rounds.filter((x) => !x.race).length;
  return {
    src, res, fin, at, c,
    place: c ? c.place : "la ronda " + round.r,
    gpName: c ? c.gp : "Gran Premio",
    tag: GP_TAG[round.gp] || "F1",
    winner: at(1), podium: [at(1), at(2), at(3)].filter(Boolean),
    me: res[ME] || null, mate, mateRes: mate ? res[mate] || null : null,
    fl: Object.keys(res).find((d) => res[d].fl === true) || null,
    outs: Object.keys(res).filter((d) => !finished(res[d])),
    table, leader: table[0], second: table[1], myRow: table.find((r) => r.id === ME),
    left, maxLeft: left * 25, full: !!(src && src.full), stale: !!core.stale
  };
}
function bestOf(ctx, ids) {
  return ids.map((id) => [id, ctx.res[id]]).filter(([, x]) => x).sort((a, b) => (finished(b[1]) ? 1 : 0) - (finished(a[1]) ? 1 : 0) || ((a[1].pos || 99) - (b[1].pos || 99)))[0] || null;
}
function rivalryHeat(core, a, b) {
  const r = (core.narrative.rivalries || []).find((x) => (x.a === a && x.b === b) || (x.a === b && x.b === a));
  return r ? r.heat : 0;
}

  dnf: ["Una pena no ver la bandera a cuadros. Pasamos página y a pensar en la siguiente.", "Duele, porque podíamos haber sumado. Lo analizaremos con el equipo.", "Son cosas de las carreras. Toca levantarse y volver más fuertes."],

  podium: ["¿Qué ha faltado para pelear por la victoria?", "¿Te vas satisfecho con el podio?"],
  points: ["¿Es un resultado que da para estar contento?", "¿Dónde se os ha escapado el podio?"],

  dnf: ["¿Cómo te sientes tras el abandono?", "¿Qué te llevas de este fin de semana?"],
  dsq: ["¿Cómo encajas la descalificación?"]
};
function driverQuote(g, id, ctx, core) {
  const x = ctx.res[id];
  const o = outcome(x);
  if (o === "unknown") return null;
  let a = g.pick(Q[o]);
  if (id === ME) {
    const lead = ctx.myRow && ctx.myRow.pos === 1;
    if (o === "win" && lead) a += g.pick([" El Mundial es largo, así que carrera a carrera.", " No miro la clasificación: miro la siguiente curva.", " Seguimos con los pies en el suelo."]);
    else if (!lead && ctx.myRow) a += g.pick([" Queda mucho campeonato y vamos a por todas.", " No vamos a rendirnos: aún quedan muchos puntos en juego."]);
    if (ctx.mateRes && finished(ctx.mateRes) && finished(x) && ctx.mateRes.pos < x.pos) a = "Ayrton ha estado mejor hoy y hay que reconocerlo. " + a;
  }
  if (id === ctx.mate) {
    const m = ctx.me;
    if (finished(x) && (!finished(m) || x.pos < m.pos)) a = g.pick(["Hoy la pista ha hablado. ", "Sigo aquí, y hoy se ha visto. ", "Algunos se olvidaron de mí demasiado pronto. "]) + a;
    else if (finished(m) && (!finished(x) || m.pos < x.pos)) a = g.pick(["No voy a hablar de mi compañero. Hablo de mi coche. ", "Andrés ha hecho su carrera; yo me centro en la mía. ", "El campeonato no se decide en una tarde. "]) + a;
  }

  };

    if (!b) return;

  }

function trendsFor(g, core, ctx, kind) {
  const t = [{ tag: "#" + ctx.tag, posts: g.int(60000, 180000) }];
  if (ctx.me) t.push({ tag: "#Arévalo", posts: g.int(30000, 140000) });
  if (ctx.winner && ctx.winner !== ME) t.push({ tag: "#" + LN(ctx.winner).replace(/\s/g, ""), posts: g.int(20000, 90000) });
  if (kind === "quali" && ctx.pole && ctx.pole !== ME) t.push({ tag: "#" + LN(ctx.pole).replace(/\s/g, ""), posts: g.int(15000, 60000) });
  if (ctx.mateRes || (ctx.qres && ctx.mate && ctx.qres[ctx.mate])) t.push({ tag: "#GuerraFríaAurelia", posts: g.int(10000, 50000) });
  if (ctx.outs && ctx.outs.length) t.push({ tag: "#" + LN(ctx.outs[0]).replace(/\s/g, "") + "DNF", posts: g.int(5000, 30000) });
  return t.sort((a, b) => b.posts - a.posts).slice(0, 5);
}

/* ---------- rivalidades vivas ---------- */
function updateRivalries(core, round) {
  const ctx = raceCtx(core, round, "race");
  const list = core.narrative.rivalries = (core.narrative.rivalries || []).slice();
  const bump = (other, delta, note) => {
    if (!DRIVERS[other] || other === ME) return;
    let r = list.find((x) => (x.a === ME && x.b === other) || (x.b === ME && x.a === other));
    if (!r) { if (delta < 4) return; r = { a: ME, b: other, heat: 20, note: note || "" }; list.push(r); }
    r.heat = Math.max(5, Math.min(100, Math.round(r.heat + delta)));
    if (note) r.note = note;
  };
  const me = ctx.me;
  list.forEach((r) => { r.heat = Math.max(5, r.heat - 2); });
  if (ctx.mate && ctx.mateRes && me) {
    const mateAhead = finished(ctx.mateRes) && (!finished(me) || ctx.mateRes.pos < me.pos);
    bump(ctx.mate, mateAhead ? 8 : 2, mateAhead ? `Senna se impuso en ${ctx.place} y el garaje de Aurelia está más dividido que nunca.` : null);
  }
  if (ctx.winner && ctx.winner !== ME && finished(me)) bump(ctx.winner, me.pos <= 3 ? 6 : 3, `${fullName(ctx.winner)} le ganó la partida en ${ctx.place}.`);
  if (finished(me)) ctx.fin.filter((f) => f.id !== ME && f.id !== ctx.mate && Math.abs(f.pos - me.pos) === 1).forEach((f) => bump(f.id, 2));
  roundMoments(core, round, "race").forEach((m) => {
    if (!m.who || m.who === ME || !["toque", "duelo", "ultimavuelta", "defensa"].includes(m.id)) return;
    const notes = { toque: `El toque en ${ctx.place} ha dejado heridas abiertas entre los dos.`, duelo: `Su duelo en ${ctx.place} fue de los que se recuerdan.`, ultimavuelta: `${fullName(m.who)} no olvida el adelantamiento de la última vuelta en ${ctx.place}.`, defensa: `En ${ctx.place}, ${fullName(m.who)} se estrelló contra el muro defensivo de Arévalo.` };
    bump(m.who, { toque: 12, duelo: 6, ultimavuelta: 8, defensa: 5 }[m.id], notes[m.id]);
  });
  if (ctx.second && ctx.myRow && ctx.myRow.pos === 1) bump(ctx.second.id, 2, ctx.second.id === ctx.mate ? null : `${fullName(ctx.second.id)} es su perseguidor más directo en el Mundial.`);
  list.forEach((r) => { if (r.b !== ctx.mate && r.a !== ctx.mate && !ctx.res[r.a === ME ? r.b : r.a]) r.heat = Math.max(5, r.heat - 1); });
  core.narrative.rivalries = list.sort((a, b) => b.heat - a.heat).slice(0, 6);
}

      ].concat(less.length ? [{ heading: "🤯 Para ponerlo en contexto", body: `Con ${cs.wins} ${cs.wins === 1 ? "victoria" : "victorias"}, Arévalo ya ha ganado más carreras que ${less.slice(0, 6).join(", ")} en toda su trayectoria real en la Fórmula 1.` }] : []),
      social: [tiny({ who: "fan", name: "Grid Nerd 📊", handle: "gridnerd_stats", text: `📊 Arévalo: ${cs.wins}V, ${cs.poles}P, ${cs.podiums} podios en ${cs.races} carreras. Tasa de victorias: ${Math.round((cs.wins / Math.max(1, cs.races)) * 100)}%.` })]
    } });
  }

  /* novatos */
  const rookies = ctx.table.filter((r) => ROOKIES.includes(r.id));
  if (rookies.length >= 3 && round.r % 3 === 0) {
    cand.push({ w: 12, key: "rookies", o: {
      kicker: "Novatos", color: "#0E9F6E",
      title: vr.pick("xk-rk", ["LA BATALLA DE LOS NOVATOS", "LOS NOVATOS, EN CIFRAS", "¿QUIÉN ES EL MEJOR DEBUTANTE?"]),
      subtitle: `${LN(rookies[0].id)} manda entre los debutantes.`,
      sections: [{ heading: "🌱 La clasificación de los novatos", body: rookies.map((r, i) => `${i + 1}. ${fullName(r.id)} (${TNAME(core, r.id)}): ${fmt(r.pts)} puntos`).join("\n") }],
      social: [tiny({ who: "journalist", id: "chicane", text: "Les rookies de cette saison ont un niveau impressionnant." })]
    } });
  }

  /* power ranking (opinión) */
  if (ctx.full || ctx.fin.length >= 5) {
    const score = (id) => {
      const x = ctx.res[id];
      const lastPts = x && x.pts ? x.pts : 0;
      const row = ctx.table.find((r) => r.id === id);
      return lastPts * 2 + (row ? row.pts / Math.max(1, ctx.leader.pts) * 25 : 0);
    };
    const top = DRIVER_IDS.slice().sort((a, b) => score(b) - score(a)).slice(0, 5);
    cand.push({ w: 15, key: "power", o: {
      kicker: "Opinión", color: "#D4001A",
      title: vr.pick("xk-pr", ["POWER RANKING: LOS CINCO MEJORES AHORA MISMO", "¿QUIÉN ESTÁ MÁS EN FORMA?", "EL RANKING DE LA SEMANA", "LOS CINCO QUE MANDAN AHORA"]),
      subtitle: "La opinión de The Pit Wall Post tras la carrera de " + ctx.place + ".",
      sections: [{ heading: "🏅 El top 5", body: top.map((id, i) => { const x = ctx.res[id]; return `${i + 1}. ${fullName(id)}: ${finished(x) ? `P${x.pos} en ${ctx.place}` : x ? "sin puntos esta vez" : "regular"}, ${fmt(core.standings[id])} puntos en el Mundial.`; }).join("\n") },
        { heading: "✍️ El criterio", body: "Pesa sobre todo la última carrera y, después, la temporada. Es una clasificación de opinión, no oficial." }],
      social: [tiny({ who: "journalist", id: "pitwall", text: vr.pick("xs-pr", [`Power ranking is out. ${LN(top[0])} on top. Agree? 👀`, `My top 5 this week: ${top.map((d) => LN(d)).join(", ")}. Fight me. 😅`, `${LN(top[0])} is the man in form right now. Change my mind.`]) })]
    } });
  }

  /* Mundial */
  if (ctx.leader && ctx.second && !ctx.stale && ctx.left > 0) {
    const gap = ctx.leader.pts - ctx.second.pts;
    cand.push({ w: ctx.left <= 5 ? 30 : 10, key: "title", o: {
      kicker: "El Mundial", color: "#F2C14E",
      title: ctx.leader.id === ME ? vr.pick("xk15", [`ARÉVALO, ${fmt(gap)} PUNTOS POR DELANTE`, "EL LÍDER NO AFLOJA"]) : `${UP(LN(ctx.leader.id))} MANDA, ARÉVALO PERSIGUE`,
      subtitle: `Quedan ${ctx.left} ${ctx.left === 1 ? "carrera" : "carreras"} y ${fmt(ctx.maxLeft)} puntos en juego.`,
      sections: [{ heading: "🧮 Las cuentas", body: `${fullName(ctx.leader.id)} lidera con ${fmt(ctx.leader.pts)} puntos. ${fullName(ctx.second.id)} es segundo con ${fmt(ctx.second.pts)}. Con ${ctx.left} ${ctx.left === 1 ? "carrera" : "carreras"} por delante quedan ${fmt(ctx.maxLeft)} puntos en juego (sin contar sprints).` + (gap > ctx.maxLeft - 25 && gap <= ctx.maxLeft ? `\n\n⚠️ Si mantiene la ventaja, ${LN(ctx.leader.id)} podría cerrar el título en la próxima carrera.` : "") }],
      social: [tiny({ who: "fan", name: "Grid Nerd 📊", handle: "gridnerd_stats", text: `📊 Quedan ${fmt(ctx.maxLeft)} puntos en juego. Ventaja del líder: ${fmt(gap)}.` })]
    } });
  }

  /* chismes */
  cand.push({ w: 9 + g.R() * 8, key: "gossip", o: {
    kicker: "Paddock Confidencial", color: "#FF3EA5",
    title: vr.pick("xk16", ["LO QUE NO SALIÓ POR TELEVISIÓN", "EL TOPO LO HA VISTO TODO", "SECRETOS DEL PADDOCK"]),
    subtitle: "Rumores, miradas y cenas a puerta cerrada. Nada confirmado, todo interesante.",
    sections: [{ heading: "🤫 Esta semana", body: g.shuffle([
      `Vista una larga conversación entre ${fullName(g.pick(DRIVER_IDS.filter((d) => d !== ME)))} y un alto cargo de ${team(g.pick(BIG_TEAMS)).name}. Dicen que hablaban de golf.`,
      `En Aurelia se ha reforzado la seguridad en el garaje. Oficialmente, por los aficionados.`,
      `${fullName(g.pick(DRIVER_IDS.filter((d) => d !== ME && d !== "senna")))} habría pedido cambios en su equipo de ingenieros.`,
      `Arévalo firmó autógrafos durante más de una hora. Su compañero salió por la puerta de atrás.`,
      `Un patrocinador millonario estaría estudiando entrar en la F1 de la mano de ${team(g.pick(TEAM_IDS.filter((t) => t !== "aurelia"))).name}.`
    ]).slice(0, 3).map((x) => "• " + x).join("\n") }],
    social: [tiny({ who: "journalist", id: "confidencial", text: vr.pick("xs-gos", ["Nueva entrega de secretos del paddock. Leed antes de que la borren. 🤫", "Hoy vengo cargado. 👀", "El Topo nunca duerme. 🕵️", "Esto no lo vais a leer en ningún otro sitio. 🤫"]) })]
  } });

  try { extraCandidates(core, round, g, ctx).forEach((c) => cand.push(c)); } catch (e) { /* sin piezas extra */ }
  const recent = new Set(S.news.filter((a) => a.auto && a.kind === "flash" && a.season === core.season && a.r < round.r && a.r >= round.r - 2).map((a) => a.id.replace(/^s\d+-r\d+-x/, "").replace(/-auto$/, "")));
  cand.forEach((c) => { if (recent.has(c.key) && c.key !== "champ") c.w *= 0.35; c.w += g.R() * 6; });
  const chosen = cand.sort((a, b) => b.w - a.w).slice(0, 4);
  return chosen.map((c, i) => xArticle(core, round, "x" + c.key, t0 - (i + 1), c.o));
}

function distLaps(core, c) { const p = (core && core.distance) || 50; return Math.max(1, Math.round((c.laps * p) / 100)); }

/* ---------- crónicas ---------- */
function autoChronicle(core, round, kind) {
  const base = templateArticle(core, round, kind);
  const g = NG(core, round, kind);
  base.id = `s${core.season}-r${round.r}-${kind}-auto`;
  if (kind === "quali") {
    const res = (round.quali && round.quali.res) || {};
    const pole = Object.keys(res).find((d) => res[d] === 1) || null;
    const ctx = { qres: res, pole, place: circuit(round.gp) ? circuit(round.gp).place : "", tag: GP_TAG[round.gp] || "F1", mate: teammatesOf(core, ME)[0], polesMe: seasonStats(core, ME).poles, table: driverTable(core), res: {} };
    const iv = [];
    const qa = (id, q, a, by) => iv.push({ speaker: fullName(id), team: teamOf(core, id), by, q, a });
    if (res[ME]) qa(ME, res[ME] === 1 ? "¿Cómo ha sido la vuelta de la pole?" : "¿Qué ha faltado hoy?", res[ME] === 1 ? g.pick(["Una vuelta muy limpia. Mañana es lo que cuenta, pero salir delante ayuda muchísimo.", "He sacado todo lo que tenía el coche. Estoy muy orgulloso del equipo."]) : g.pick(["Nos ha faltado un poco en el último sector. Mañana hay carrera.", "No es donde queríamos estar, pero la carrera es larga."]), "cronometro");
    if (pole && pole !== ME) qa(pole, "¿Te esperabas la pole?", g.pick(["Hemos trabajado mucho para esto. Mañana, a convertirla en victoria.", "Qué vuelta. El coche iba sobre raíles."]), NAT_OUTLET[DRIVERS[pole].nat] || "pitwall");
    if (ctx.mate && res[ctx.mate]) qa(ctx.mate, "¿Cómo ves la carrera de mañana?", res[ctx.mate] < (res[ME] || 99) ? g.pick(["Mañana saldré por delante de mi compañero. Eso ya dice algo.", "Hoy he sido más rápido. Mañana, más."]) : g.pick(["La carrera no se gana el sábado.", "Tenemos ritmo para remontar."]), "folha");
    base.interviews = iv;
    base.frontPages = makeFrontPages(g, core, ctx, "quali");
    base.social = socialFor(g, core, ctx, "quali");
    base.trending = trendsFor(g, core, Object.assign({ me: res[ME] ? {} : null }, ctx), "quali");
    return enrichChronicle(base, core, round, kind, g);
  }
  const ctx = raceCtx(core, round, kind);
  const iv = [];
  const q1 = driverQuote(g, ME, ctx, core);
  if (q1) iv.push(Object.assign(q1, { by: "cronometro" }));
  if (ctx.winner && ctx.winner !== ME) { const q = driverQuote(g, ctx.winner, ctx, core); if (q) iv.push(Object.assign(q, { by: NAT_OUTLET[DRIVERS[ctx.winner].nat] || "pitwall" })); }
  if (ctx.mate && ctx.mate !== ctx.winner) { const q = driverQuote(g, ctx.mate, ctx, core); if (q) iv.push(Object.assign(q, { by: "folha" })); }
  if (kind === "race") {
    const other = ctx.podium.find((d) => d !== ME && d !== ctx.winner && d !== ctx.mate) || ctx.outs.find((d) => d !== ME && d !== ctx.mate);
    if (other) { const q = driverQuote(g, other, ctx, core); if (q) iv.push(Object.assign(q, { by: NAT_OUTLET[DRIVERS[other].nat] || "chicane" })); }
    iv.push(Object.assign(bossQuote(g, ctx), { by: "rettilineo" }));
  }
  base.interviews = iv.slice(0, 5);
  if (kind === "race") {
    base.frontPages = makeFrontPages(g, core, ctx, "race");
    base.social = socialFor(g, core, ctx, "race");
    base.trending = trendsFor(g, core, ctx, "race");
    const colOutlet = g.pick(["cronometro", "rettilineo", "pitwall", "folha"]);
    const m = MEDIA[colOutlet];
    const lead = ctx.leader;
    base.column = {
      outlet: colOutlet,
      title: g.pick(ctx.me && finished(ctx.me) && ctx.me.pos === 1 ? ["El problema de los demás se llama Arévalo", "Cuando ganar parece fácil", "La normalidad de lo extraordinario"] : ["La temporada ya no tiene dueño", "Lecciones de un domingo movido", "El Mundial se aprieta"]),
      body: `${ctx.winner ? `${fullName(ctx.winner)} ganó en ${ctx.place}` : `Se disputó el ${ctx.gpName}`}${ctx.me ? ` y Arévalo ${finished(ctx.me) ? `terminó ${ctx.me.pos}.º` : "no terminó"}` : ""}. ${lead ? `${fullName(lead.id)} lidera el Mundial con ${fmt(lead.pts)} puntos.` : ""}\n\n` +
        g.pick([
          "Lo que más impresiona no es la velocidad, sino la calma. En una parrilla donde todos cometen errores bajo presión, hay pilotos que parecen inmunes a ella. Esa es la diferencia entre ganar carreras y ganar campeonatos.",
          "La Fórmula 1 tiene memoria corta: un fin de semana te encumbra y el siguiente te devuelve al suelo. Por eso la regularidad vale oro, y por eso las rachas acaban pesando más que las victorias sueltas.",
          "Aurelia vive una paradoja: tiene el coche y los pilotos para ganarlo todo, pero también la bomba de relojería más peligrosa del paddock en su propio garaje. Gestionar a dos gallos es un arte que pocos equipos dominan."
        ]) + (m.lang !== "es" ? "\n\n(Columna traducida del original.)" : "")
    };
  } else {
    base.social = socialFor(g, core, ctx, "race").slice(0, 4);
  }
  return enrichChronicle(base, core, round, kind, g);
}

/* Genera y guarda todo lo automático de una sesión. Devuelve el id principal. */
async function publishAutoNews(session, r, edit) {
  const core = clone(S.core);
  const round = roundOf(core, r);
  const now = Date.now();
  const keep = (id) => { const a = S.news.find((x) => x.id === id); return !a || a.auto; };
  const writes = [];
  const main = autoChronicle(core, round, session);
  const legacy = findArticle(core.season, r, session);
  if (legacy && legacy.auto && legacy.id !== main.id) await Store.deleteArticle(legacy.id).catch(() => null);
  if (legacy && !legacy.auto) {
    /* Hay una crónica escrita a mano o por la IA: no se toca. */
  } else {
    const prev = S.news.find((x) => x.id === main.id);
    main.t = edit && prev ? prev.t : now;
    writes.push(main);
  }
  if (session === "race") {
    updateRivalries(core, round);
    core.narrative.storyline = storyline(core);
    S.core = core;
    await Store.saveCore().catch(() => null);
    const old = S.news.filter((a) => a.auto && a.season === core.season && a.r === r && a.kind === "flash");
    for (const a of old) await Store.deleteArticle(a.id).catch(() => null);
    const base = edit && S.news.find((x) => x.id === main.id) ? S.news.find((x) => x.id === main.id).t : now;
    extraPieces(core, round, base).forEach((a) => writes.push(a));
    const nx = core.rounds.find((x) => x.r > r && !x.race);
    if (nx && nx.gp) {
      const pv = autoPrevia(core, nx, base - 10);
      const existing = findArticle(core.season, nx.r, "previa");
      if (pv && (!existing || existing.auto)) {
        if (existing && existing.id !== pv.id) await Store.deleteArticle(existing.id).catch(() => null);
        writes.push(pv);
      }
    }
  }
  S.core = core;
  await Store.saveCore().catch(() => null);
  for (const a of writes) if (keep(a.id)) await Store.saveArticle(a).catch(() => null);
  return writes.length ? writes[0].id : legacy ? legacy.id : null;
}

/* ---------- mi historia ---------- */
function storyline(core) {
  const cs = careerStats(core, S.seasons, ME);
  const t = driverTable(core);
  const me = t.find((r) => r.id === ME);
  return `Temporada ${core.season}. Andrés Arévalo, piloto de Aurelia Racing junto a Ayrton Senna, suma ${cs.wins} victorias, ${cs.poles} poles y ${cs.podiums} podios en ${cs.races} carreras. Es ${me.pos}.º del Mundial con ${fmt(me.pts)} puntos.`;
}
function storyChapters(core) {
  const seasons = seasonsSorted(S.seasons);
  const allRounds = seasons.map((s) => ({ season: s.season, rounds: s.rounds || [], entry: s.entry || (core.history || []).find((h) => h.season === s.season) })).concat([{ season: core.season, rounds: core.rounds, entry: null, current: true }]);

  const miles = [];
  const nameOf = (e) => (circuit(e.round.gp) ? circuit(e.round.gp).name : "ronda " + e.round.r);
  if (races[0]) miles.push({ icon: "🏁", title: "Debut en la Fórmula 1", text: `${nameOf(races[0])}, temporada ${races[0].season}: ${finished(races[0].x) ? (races[0].x.pos === 1 ? "¡victoria en su primera carrera!" : `terminó ${races[0].x.pos}.º.`) : "no pudo terminar."}` });

  if (fw && fw !== races[0]) miles.push({ icon: "🏆", title: "Primera victoria", text: `${nameOf(fw)}, temporada ${fw.season}.` });
  const fp = tl.find((e) => e.q === 1);
  if (fp) miles.push({ icon: "⏱️", title: "Primera pole", text: `${nameOf(fp)}, temporada ${fp.season}.` });
  const fd = races.find((e) => !finished(e.x));
  if (fd) miles.push({ icon: "💥", title: "Primer abandono", text: `${nameOf(fd)}, temporada ${fd.season}.` });
  let wins = 0, pods = 0;
  races.forEach((e) => {
    if (finished(e.x) && e.x.pos === 1) { wins++; if ([5, 10, 25, 50, 75, 100].includes(wins)) miles.push({ icon: "🥇", title: `Victoria número ${wins}`, text: `${nameOf(e)}, temporada ${e.season}.` }); }
    if (finished(e.x) && e.x.pos <= 3) { pods++; if ([10, 25, 50, 100].includes(pods)) miles.push({ icon: "🍾", title: `Podio número ${pods}`, text: `${nameOf(e)}, temporada ${e.season}.` }); }
  });
  const cs = careerStats(core, S.seasons, ME);
  if (cs.winStreak.best >= 3) miles.push({ icon: "🔥", title: `Racha de ${cs.winStreak.best} victorias seguidas`, text: "Su mejor racha hasta hoy." });
  (core.history || []).forEach((h) => { if (h.champion === ME) miles.push({ icon: "👑", title: `Campeón del mundo ${h.season}`, text: `Con ${fmt(h.pts)} puntos y ${h.wins} victorias.` }); });
  const chapters = allRounds.map((s) => {
    const done = s.rounds.filter((r) => r.race);
    const my = done.map((r) => ({ r, x: resOf(r, ME), q: qOf(r, ME) }));
    const w = my.filter((e) => finished(e.x) && e.x.pos === 1);
    const p = my.filter((e) => finished(e.x) && e.x.pos <= 3);
    const poles = s.rounds.filter((r) => qOf(r, ME) === 1).length;
    const dnf = my.filter((e) => e.x && !finished(e.x)).length;
    const winsAt = w.map((e) => circuit(e.r.gp) ? circuit(e.r.gp).name : "R" + e.r.r);
    let text = "";
    if (!done.length) text = s.current ? "La temporada está a punto de empezar. Todo está por escribir." : "Sin carreras registradas.";
    else {
      text = `${done.length} ${done.length === 1 ? "carrera" : "carreras"} ${s.current ? "disputadas hasta ahora" : "disputadas"}: ${w.length} ${w.length === 1 ? "victoria" : "victorias"}, ${poles} poles, ${p.length} podios y ${dnf} ${dnf === 1 ? "abandono" : "abandonos"}.`;
      if (winsAt.length) text += ` Ganó en ${winsAt.join(", ")}.`;
      if (s.entry) text += ` Terminó ${s.entry.pos}.º del Mundial con ${fmt(s.entry.pts)} puntos${s.entry.champion === ME ? ": ¡campeón del mundo!" : `. El título fue para ${fullName(s.entry.champion)}.`}`;
      else if (s.current) { const me = driverTable(core).find((r) => r.id === ME); text += ` Ahora mismo es ${me.pos}.º del Mundial con ${fmt(me.pts)} puntos.`; }
      const mate = s.entry ? s.entry.teammate : teammatesOf(core, ME)[0];
      const h = mate ? headToHead(s.rounds, ME, mate) : null;
      if (h && h.r.a + h.r.b) text += ` Contra ${LN(mate)}: ${h.r.a}-${h.r.b} en carrera y ${h.q.a}-${h.q.b} en clasificación.`;
    }
    const title = !done.length ? "Todo por escribir" : s.entry && s.entry.champion === ME ? "La temporada del título" : w.length >= done.length / 2 ? "La temporada del dominio" : w.length ? "La temporada de las victorias" : p.length ? "La temporada del aprendizaje" : "La temporada más dura";
    return { season: s.season, title, text, current: !!s.current };
  });
  return { miles, chapters, rivalries: (core.narrative.rivalries || []).slice(0, 4) };
}

/* ---------- clasificación histórica ---------- */
function allTimeTable(core) {
  const seasons = seasonsSorted(S.seasons);
  const rows = {};
  DRIVER_IDS.forEach((d) => { rows[d] = { id: d, pts: 0, wins: 0, podiums: 0, poles: 0, titles: 0, seasons: 0, races: 0 }; });
  const add = (standings, rounds) => {
    DRIVER_IDS.forEach((d) => { rows[d].pts = r1(rows[d].pts + Number((standings || {})[d] || 0)); });
    (rounds || []).forEach((round) => {
      DRIVER_IDS.forEach((d) => {
        if (qOf(round, d) === 1) rows[d].poles++;
        const x = resOf(round, d);
        if (x) rows[d].races++;
        if (finished(x)) { if (x.pos === 1) rows[d].wins++; if (x.pos <= 3) rows[d].podiums++; }
      });
    });
  };
  seasons.forEach((s) => add(s.standings, s.rounds));
  add(core.standings, core.rounds);
  (core.history || []).forEach((h) => { if (rows[h.champion]) rows[h.champion].titles++; });
  return Object.values(rows);
}
function champions(core) {
  return (core.history || []).map((h) => ({ season: h.season, driver: h.champion, team: h.constructorsChampion, me: h.pos }));
}

/* ---------- memoria anti-repetición ---------- */
function makeVary(core, g) {
  const nar = core.narrative = core.narrative || {};
  const recent = nar.recent = Array.isArray(nar.recent) ? nar.recent : [];
  const set = new Set(recent);
  return {
    g,
    pick(key, arr) {
      if (!arr || !arr.length) return "";
      let pool = arr.map((_, i) => i).filter((i) => !set.has(key + ":" + i));
      if (!pool.length) {
        for (let i = recent.length - 1; i >= 0; i--) if (recent[i].startsWith(key + ":")) { set.delete(recent[i]); recent.splice(i, 1); }
        pool = arr.map((_, i) => i);
      }
      const i = pool[Math.floor(g.R() * pool.length)];
      const k = key + ":" + i;
      set.add(k); recent.push(k);
      while (recent.length > 700) set.delete(recent.shift());
      return arr[i];
    },
    f(key, arr, vars) { return g.fill(this.pick(key, arr), vars || {}); }
  };
}

/* ---------- crónica enriquecida ---------- */
function enrichChronicle(base, core, round, kind, g) {
  const vr = makeVary(core, g);
  const moms = roundMoments(core, round, kind);
  const gr = kind === "race" ? gridOf(round, ME) : null;
  if (kind === "quali") {
    const res = (round.quali && round.quali.res) || {};
    const pole = Object.keys(res).find((d) => res[d] === 1) || null;
    const ctx = { g2: g, qres: res, pole, place: circuit(round.gp) ? circuit(round.gp).place : "", tag: GP_TAG[round.gp] || "F1", mate: teammatesOf(core, ME)[0], polesMe: seasonStats(core, ME).poles, table: driverTable(core), res: {} };
    if (moms.length) base.sections.push({ heading: "🔥 Las claves del sábado", body: moms.map((m) => momentSentence(vr, m, { P: ctx.place })).filter(Boolean).join("\n\n") });
    const iv = [];
    const q = res[ME];
    const tq = moms.find((m) => m.id.startsWith("q_"));
    if (q) iv.push({ speaker: fullName(ME), team: teamOf(core, ME), by: "cronometro", q: tq ? vr.f("qq-" + tq.id, { q_ultima: ["¿Cómo fue esa vuelta en el último intento?"], q_milesimas: ["Por milésimas con {Xl}. ¿Cómo se vive eso?"], q_lluvia: ["¿Cómo fue clasificar con lluvia?"], q_roja: ["¿Cómo gestionaste la bandera roja?"], q_error: ["¿Qué pasó en tu vuelta buena?"], q_trafico: ["¿Te molestó el tráfico?"] }[tq.id], { Xl: tq.who ? LN(tq.who) : "tu rival" }) : vr.pick(q === 1 ? "qq-pole" : "qq-np", q === 1 ? ["¿Cómo ha sido la vuelta de la pole?", "¿Esperabas la pole?", "¿Dónde has marcado la diferencia?"] : ["¿Qué ha faltado hoy?", "¿Cómo ves la carrera de mañana desde ahí?", "¿Estás contento con la posición?"]),
      a: vr.pick(q === 1 ? "qa-pole" : "qa-np", q === 1 ? ["Una vuelta muy limpia. Mañana es lo que cuenta, pero salir delante ayuda muchísimo.", "He sacado todo lo que tenía el coche. Estoy orgulloso del equipo.", "Me ha salido la vuelta perfecta. Ahora, a rematar mañana."] : ["Nos ha faltado un poco en el último sector. Mañana hay carrera.", "No es donde queríamos estar, pero la carrera es larga.", "Desde ahí se puede remontar. Confío en el ritmo de carrera."]) + " " + tail(vr, ME) });
    if (pole && pole !== ME) iv.push({ speaker: fullName(pole), team: teamOf(core, pole), by: outletFor(pole), q: vr.pick("qq-pole2", ["¿Te esperabas la pole?", "¿Qué ha tenido de especial esta vuelta?"]), a: vr.pick("qa-pole2", ["Hemos trabajado mucho para esto. Mañana, a convertirla en victoria.", "Qué vuelta. El coche iba sobre raíles.", "Ganarle la pole a Arévalo tiene su mérito."]) + " " + tail(vr, pole) });
    if (ctx.mate && res[ctx.mate]) iv.push({ speaker: fullName(ctx.mate), team: teamOf(core, ctx.mate), by: "folha", q: vr.pick("qq-mate", ["¿Cómo ves la carrera de mañana?", "¿Qué te ha faltado para estar por delante?"]), a: (res[ctx.mate] < (q || 99) ? vr.pick("qa-mate-a", ["Mañana saldré por delante de mi compañero. Eso ya dice algo.", "Hoy he sido más rápido. Mañana, más.", "El sábado es mío. El domingo, ya veremos."]) : vr.pick("qa-mate-b", ["La carrera no se gana el sábado.", "Tenemos ritmo para remontar.", "Mañana es otro día."])) + " " + tail(vr, ctx.mate) });
    base.interviews = iv;
    base.social = buildSocial(vr, core, round, ctx, "quali", moms, null);
    return base;
  }
  const ctx = Object.assign(raceCtx(core, round, kind), { g2: g });
  const cc = kind === "race" ? champCtx(core, round) : null;
  const vars = { P: ctx.place, grid: gr || "", pos: finished(ctx.me) ? ctx.me.pos : "", gain: gr && finished(ctx.me) ? gr - ctx.me.pos : "" };
  if (moms.length) base.sections.splice(1, 0, { heading: "🔥 Las claves de la carrera", body: moms.slice(0, 5).map((m) => momentSentence(vr, m, vars)).filter(Boolean).join("\n\n") });
  if (cc) {
    const lines = champSentences(vr, core, round, cc);
    if (lines.length) base.sections.push({ heading: "🏆 El campeonato", body: lines.join("\n\n") });
    const others = [];
    ctx.podium.filter((d) => d !== ME).forEach((d) => others.push(vr.f("oth-pod", ["{X} ({T}) completó el podio con un {N}.º puesto.", "Buen día para {X}: {N}.º y a casa con puntos importantes.", "{X} subió al cajón en la {N}.ª posición."], { X: fullName(d), T: TNAME(core, d), N: ctx.res[d].pos })));
    const best = ctx.fin.find((f) => f.pos > 3 && gridOf(round, f.id) && gridOf(round, f.id) - f.pos >= 6 && f.id !== ME);
    if (best) others.push(vr.f("oth-rem", ["{X} firmó la otra gran remontada del día: de {G}.º a {N}.º.", "Ojo a {X}, que salió {G}.º y terminó {N}.º."], { X: fullName(best.id), G: gridOf(round, best.id), N: best.pos }));
    const rook = ctx.fin.filter((f) => ROOKIES.includes(f.id) && f.id !== ME)[0];
    if (rook && rook.pos <= 10) others.push(vr.f("oth-rook", ["Entre los novatos, el mejor fue {X}, {N}.º.", "{X} fue el novato más destacado, con un {N}.º puesto."], { X: fullName(rook.id), N: rook.pos }));
    if (others.length) base.sections.push({ heading: "👀 Más allá de Arévalo", body: others.slice(0, 3).join(" ") });
  }
  base.interviews = buildInterviews(vr, core, round, Object.assign(ctx, { g: g }), kind, moms, cc);
  base.social = buildSocial(vr, core, round, ctx, kind, moms, cc).slice(0, kind === "race" ? 14 : 5);
  if (kind === "race") {
    base.trending = buildTrends(ctx, moms, kind);
    const mh = momentHeadline(vr, moms, ctx);
    const fp = (base.frontPages || []).find((f) => f.outlet === "cronometro");
    if (mh && fp) { fp.headline = mh.headline; fp.deck = momentSentence(vr, mh.m, vars); }
    if (mh && g.R() < 0.6) base.title = mh.headline;
  }
  return base;
}

function legendsTable(core, sort) {
  const cs = careerStats(core, S.seasons, ME);
  const me = { id: "me", me: true, name: "Andrés Arévalo", flag: "🇪🇸", titles: cs.titles, wins: cs.wins, podiums: cs.podiums, poles: cs.poles, gp: cs.races, pts: cs.pts };
  const key = sort || "titles";
  const cmp = (a, b) => (b[key] - a[key]) || (b.titles - a.titles) || (b.wins - a.wins) || (b.podiums - a.podiums) || (a.me ? 1 : b.me ? -1 : 0);
  const all = LEGENDS.concat([me]).sort(cmp);
  const pos = all.findIndex((r) => r.me) + 1;
  const inTop = pos <= 20;
  const rows = all.filter((r) => !r.me || inTop).slice(0, 20);
  const above = inTop ? (pos > 1 ? all[pos - 2] : null) : rows[19];
  return { rows, me, pos, inTop, above, key };
}

/* ---------- estado ---------- */
function fameFromStats(core) {
  const cs = careerStats(core, S.seasons, ME);
  return Math.max(5, Math.min(95, 10 + cs.wins * 6 + (cs.podiums - cs.wins) * 2 + cs.poles * 1.5 + cs.titles * 15));
}
function blankCareer(core) {
  const cs = careerStats(core, S.seasons, ME);
  const salary = 1500000;
  const races = cs.races;
  const fame = fameFromStats(core);
  const money = 250000 + Math.round((salary / (core.totalRounds || 20)) * races) + cs.wins * 150000 + (cs.podiums - cs.wins) * 50000;
  return {
    v: 1, fame: Math.round(fame * 10) / 10, followers: Math.round(150000 + fame * 28000), money,
    ledger: [{ id: "init", key: "init", season: core.season, r: 0, label: "Ahorros y sueldos hasta hoy", amount: money }],
    contract: { team: teamOf(core, ME) || "aurelia", salary, from: core.season, until: core.season + 1, role: "igualdad", bonus: { win: 150000, podium: 50000, title: 2000000 } },
    trust: 62, agent: 0, cm: 0, owned: [], helmet: null, inbox: [], sponsors: [], pending: null,
    objectives: null, achievements: {}, dotd: {}, press: {}, processed: legacyProcessed(core), awards: [], renewalAsked: null, legacyMarked: true
  };
}
function legacyProcessed(core) {
  const p = {};
  core.rounds.forEach((rd) => {
    if (rd.quali) p[`${core.season}-${rd.r}-quali`] = { legacy: true };
    if (rd.race) p[`${core.season}-${rd.r}-race`] = { legacy: true };
  });
  return p;
}
function careerView(core) { return (core && core.career) || blankCareer(core); }
function careerOf(core) {
  if (!core.career) core.career = blankCareer(core);
  const c = core.career;
  if (!c.legacyMarked) {
    /* Datos de la versión anterior: las carreras previas ya se cobraron al crear la carrera. */
    const init = c.ledger.some((l) => l.id === "init");
    if (init) Object.entries(legacyProcessed(core)).forEach(([k, v]) => { if (!c.processed[k]) c.processed[k] = v; });

function fmtMoney(n) {

function fameTier(f) {

function marketValue(core) {
  const c = careerView(core);

function netWorth(core) {

function cmMult(c) { return 1 + [0, 0.15, 0.3, 0.5][c.cm || 0]; }

function heatBump(core, other, delta, note) {

  let r = list.find((x) => (x.a === ME && x.b === other) || (x.b === ME && x.a === other));

function checkAchievements(core) {
  const c = careerView(core);
  const tl = timeline(core, S.seasons, ME);
  const races = tl.filter((e) => e.round.race && e.x);
  const cs = careerStats(core, S.seasons, ME);
  const got = {};
  const hit = (id, e) => { if (!got[id]) got[id] = e ? { season: e.season, r: e.round.r } : { season: core.season, r: null }; };
  races.forEach((e, i) => {
    const w = finished(e.x) && e.x.pos === 1;
    const g = gridOf(e.round, ME);
    if (w) hit("first_win", e);
    if (w && i === 0) hit("debut_win", e);
    if (w && e.q === 1) hit("perfect", e);
    if (w && e.q === 1 && e.x.fl === true) hit("hattrick", e);
    if (finished(e.x) && e.x.pos <= 3 && g >= 10) hit("comeback", e);
    if (w && g >= 6) hit("backwin", e);
    if (w && e.round.gp === "esp") hit("home", e);
    if (w && e.round.gp === "mon") hit("monaco", e);
  });
  tl.forEach((e) => { if (e.q === 1) hit("first_pole", e); });
  if (cs.winStreak.best >= 3) hit("streak3");
  if (cs.winStreak.best >= 5) hit("streak5");
  if (cs.wins >= 10) hit("wins10");
  if (cs.wins >= 25) hit("wins25");
  if (cs.podiums >= 25) hit("pods25");
  if (cs.poles >= 10) hit("poles10");
  const mate = teammatesOf(core, ME)[0];
  if (mate && headToHead(core.rounds, ME, mate).r.a >= 5) hit("senna5");
  if ((core.history || []).some((h) => h.champion === ME)) hit("champion");
  if ((core.history || []).some((h) => h.champion === ME && h.constructorsChampion === h.team)) hit("double");
  if (Object.values(c.dotd || {}).filter((v) => v && v.winner === ME).length >= 3) hit("dotd3");
  if (c.money >= 10000000) hit("millionaire");
  if (c.fame >= 75) hit("star");
  return got;
}

function makeOffer(core, c, g, teamId, kind) {

  const years = kind === "renewal" ? 2 : g.pick([1, 2, 2, 3]);
  const myPos = driverPos(core, ME);
  const mates = teamDrivers(core, teamId).filter((d) => d !== ME);
  const lead = mates.every((d) => driverPos(core, d) > myPos);
  const role = kind === "renewal" ? (c.trust >= 65 && lead ? "primer" : "igualdad") : (w < 0.9 || lead ? "primer" : "igualdad");

}

const TONE_FX = { humilde: { fame: 0.4, trust: 1, heat: -3 }, "diplomático": { fame: 0.6, trust: 0, heat: 0 }, provocador: { fame: 1.8, trust: -2, heat: 8 } };

function careerAfterSession(core, session, r) {
  if (!core.career) {

  if (session === "quali") {

  const mate = teammatesOf(core, ME)[0];
  /* fama */

  else if (o === "podium") addLedger(c, key, core.season, r, "Prima por podio", c.contract.bonus.podium);
  addLedger(c, key, core.season, r, "Derechos de imagen", Math.round(c.fame * 2500));
  c.sponsors.forEach((s) => { if (s.left > 0) { addLedger(c, key, core.season, r, `Patrocinio: ${s.name}`, s.perRace); s.left--; p.sponsors.push(s.id); } });

  if (c.cm) addLedger(c, key, core.season, r, "Community manager", -[0, 8000, 20000, 45000][c.cm]);

}

/* ---------- negociación ----------

const NEG_STEPS = [0, 0.1, 0.2, 0.3, 0.5];
function ensureNeg(core, c, o, kind) {
  if (o.max) return o;
  const w = TEAM_WEALTH[o.team] || 0.7;
  const f = c.fame;
  const interest = kind === "renewal" ? (c.trust >= 70 ? "alto" : c.trust >= 45 ? "medio" : "bajo") : w >= 1 ? (f >= 65 ? "alto" : f >= 45 ? "medio" : "bajo") : (f >= 35 ? "alto" : "medio");
  const extra = { alto: 0.32, medio: 0.18, bajo: 0.07 }[interest] + (c.agent || 0) * 0.05 + (kind === "renewal" ? (c.trust - 55) / 300 : 0);
  o.interest = interest;
  o.base = o.base || o.salary;
  o.max = Math.round((o.salary * (1.04 + Math.max(0, extra))) / 50000) * 50000;
  o.patience = o.patience == null ? 3 : o.patience;
  o.roleOk = o.role === "primer" || interest === "alto" || w < 0.9;

function agentHint(c, o) {
  if (!c.agent) return "Sin representante no sabes hasta dónde pueden llegar. Contratar uno en la tienda te daría pistas.";
  if (c.agent === 1) return `Tu representante cree que tienen margen para subir ${o.max > o.salary * 1.2 ? "bastante" : o.max > o.salary * 1.08 ? "algo" : "muy poco"}.`;
  const lo = Math.round((o.max * 0.93) / 100000) * 100000, hi = Math.round((o.max * 1.03) / 100000) * 100000;
  return `${AGENT_NAME} calcula que su tope está entre ${fmtMoney(lo)} y ${fmtMoney(hi)} al año${o.roleOk ? "" : ", y que no te darán el rol de primer piloto"}.`;
}
function negotiate(core, mail, ask) {
  const c = careerOf(core);
  const o = ensureNeg(core, c, mail.data, mail.type);
  if (o.patience <= 0) return { ok: "no", text: "Ya no quieren negociar más." };
  let max = o.max;
  let lev = null;
  if (ask.leverage) {
    const other = c.inbox.find((m) => m.id === ask.leverage && m.status === "new" && (m.type === "offer" || m.type === "renewal"));
    if (other && other.data.salary > max) {
      lev = other;
      const stretch = o.interest === "alto" ? 1.25 : o.interest === "medio" ? 1.12 : 1.04;
      max = Math.min(Math.round((other.data.salary * 1.02) / 50000) * 50000, Math.round((o.max * stretch) / 50000) * 50000);
    }
  }
  const wantSalary = Math.round(ask.salary / 50000) * 50000;
  const wantYears = Math.max(1, Math.min(5, ask.years || o.years));
  const wantRole = ask.role || o.role;
  const parts = [];
  let years = wantYears, role = wantRole;
  if (wantYears > o.maxYears) { years = o.maxYears; parts.push(`como mucho te ofrecen ${o.maxYears} temporadas`); }
  if (wantRole === "primer" && !o.roleOk) { role = o.role; parts.push("el rol de primer piloto no es negociable"); }
  o.patience--;
  if (mail.type === "renewal") addTrust(c, -1);
  if (wantSalary <= max) {
    Object.assign(o, { salary: Math.max(o.salary, wantSalary), years, role, agreed: true });
    if (lev) o.max = Math.max(o.max, max);
    return { ok: parts.length ? "half" : "yes", text: `${lev ? `La oferta de ${team(lev.data.team).name} ha surtido efecto. ` : ""}Aceptan ${fmtMoney(o.salary)} al año durante ${o.years} ${o.years === 1 ? "temporada" : "temporadas"}${o.role === "primer" ? " como primer piloto" : ""}${parts.length ? ", pero " + parts.join(" y ") : ""}. Ya puedes firmar.` };
  }
  if (wantSalary <= max * 1.15) {
    Object.assign(o, { salary: Math.max(o.salary, max), years, role, agreed: true });
    o.max = Math.max(o.max, max);
    o.patience = 0;
    return { ok: "half", text: `No llegan a tanto. Su última palabra: ${fmtMoney(o.salary)} al año${parts.length ? "; además, " + parts.join(" y ") : ""}.` };
  }
  if (o.patience <= 0) {
    if (mail.type === "renewal") { addTrust(c, -4); return { ok: "no", text: "Aurelia da por cerrada la negociación. La oferta sigue sobre la mesa tal cual, pero no habrá más cambios." }; }

  }

  const awards = [
    { id: "driver", name: "Piloto del año", who: entry.champion },
    { id: "rookie", name: "Novato del año", who: rookies[0] ? rookies[0].id : null },
    { id: "team", name: "Equipo del año", team: entry.constructorsChampion },
    { id: "rival", name: "Rivalidad del año", text: heat ? `${LN(heat.a)} contra ${LN(heat.b)}` : null },
    { id: "fans", name: "Favorito de la afición", who: n.fame >= 50 ? ME : table[0].id }
  ].filter((a) => a.who || a.team || a.text);
  awards.forEach((a) => { if (a.who === ME) addFame(n, 2); });
  n.awards = (n.awards || []).concat([{ season: core.season, list: awards }]);
  /* fichaje */
  let transfer = null;
  if (n.pending && n.pending.season === core.season + 1) {
    const to = n.pending.team, from = teamOf(core, ME);
    const others = teamDrivers(core, to).sort((a, b) => (core.standings[a] || 0) - (core.standings[b] || 0));
    const swap = others[0];
    next.roster = Object.assign({}, next.roster || {});
    next.roster[ME] = Object.assign({}, next.roster[ME] || {}, { team: to });
    if (swap) next.roster[swap] = Object.assign({}, next.roster[swap] || {}, { team: from });
    n.contract = { team: to, salary: n.pending.salary, from: core.season + 1, until: core.season + n.pending.years, role: n.pending.role, bonus: n.pending.bonus };
    transfer = { to, from, swap };
    n.pending = null;
    n.trust = 60;
  } else if (n.contract.until <= core.season) {
    n.contract = Object.assign({}, n.contract, { from: core.season + 1, until: core.season + 1, salary: Math.round(n.contract.salary * 0.9 / 50000) * 50000 });
    addMail(n, { id: `renew-auto-${core.season}`, key: "close", season: core.season + 1, r: 0, type: "team", from: AURELIA_BOSS + " (Aurelia Racing)", subject: "Contrato prorrogado un año", body: "Como no firmaste la renovación, activamos la cláusula de un año con un sueldo algo menor. Tendrás que ganártelo." });
  }
  n.objectives = null;
  n.renewalAsked = null;
  n.processed = {};
  addMail(n, { id: `gala-${core.season}`, key: "close", season: core.season + 1, r: 0, type: "info", from: "Gala de la Fórmula 1", subject: `🏅 Premios de la temporada ${core.season}`, body: awards.map((a) => `${a.name}: ${a.who ? fullName(a.who) : a.team ? team(a.team).name : a.text}`).join("\n") + (lines.length ? `\n\nTus objetivos:\n${lines.join("\n")}` : "") });
  next.career = n;
  return { awards, lines, transfer };
}

/* ---------- navegación ---------- */
const TABS = [
  { id: "home", label: "Inicio", icon: "home" },
  { id: "news", label: "Noticias", icon: "news" },
  { id: "races", label: "Carreras", icon: "flag" },
  { id: "me", label: "Mi carrera", icon: "me" },
  { id: "paddock", label: "Paddock", icon: "paddock" }
];
function currentScreen() {
  const st = S.nav.stacks[S.nav.tab];
  if (st.length) return st[st.length - 1];
  return { screen: S.nav.tab, arg: null };
}
function scrollKey() { return S.nav.tab + ":" + S.nav.stacks[S.nav.tab].length; }
function saveScroll() { S.scroll[scrollKey()] = window.scrollY; }
function go(fn, anim) {
  saveScroll();
  fn();
  S.anim = anim || "fade";
  render();
  const y = S.scroll[scrollKey()] || 0;
  window.scrollTo(0, anim === "enter" ? 0 : y);
}
function push(screen, arg) {
  go(() => { S.nav.stacks[S.nav.tab].push({ screen, arg }); }, "enter");
}
function back() {
  go(() => { S.nav.stacks[S.nav.tab].pop(); }, "fade");
}
function switchTab(tab) {
  if (tab === "standings") { S.ui.racesSeg = "standings"; tab = "races"; S.nav.stacks.races = []; if (S.nav.tab === "races") { S.anim = "fade"; render(); window.scrollTo(0, 0); return; } }
  if (tab === S.nav.tab) {
    if (S.nav.stacks[tab].length) { S.nav.stacks[tab] = []; S.anim = "fade"; render(); window.scrollTo(0, 0); }
    else window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  go(() => { S.nav.tab = tab; }, "fade");
}
function openArticle(id) {
  S.nav.tab = "news";
  S.nav.stacks.news = [{ screen: "article", arg: id }];
  S.anim = "enter";
  render();
  window.scrollTo(0, 0);
}
