/* ---------- navegación ---------- */
const TABS = [
  { id: "home", label: "Inicio", icon: "home" },
  { id: "news", label: "Noticias", icon: "news" },
  { id: "races", label: "Carreras", icon: "flag" },
  { id: "standings", label: "Mundial", icon: "trophy" },
  { id: "paddock", label: "Paddock", icon: "paddock" }
];
function currentScreen() {
  const st = S.nav.stacks[S.nav.tab];
  if (st.length) return st[st.length - 1];
  return { screen: S.nav.tab, arg: null };
}
function scrollKey() { return S.nav.tab + ":" + S.nav.stacks[S.nav.tab].length; }
function saveScroll() { S.scroll[scrollKey()] = window.scrollY; }
function go(fn, anim) {
  saveScroll();
  fn();
  S.anim = anim || "fade";
  render();
  const y = S.scroll[scrollKey()] || 0;
  window.scrollTo(0, anim === "enter" ? 0 : y);
}
function push(screen, arg) {
  go(() => { S.nav.stacks[S.nav.tab].push({ screen, arg }); }, "enter");
}
function back() {
  go(() => { S.nav.stacks[S.nav.tab].pop(); }, "fade");
}
function switchTab(tab) {
  if (tab === S.nav.tab) {
    if (S.nav.stacks[tab].length) { S.nav.stacks[tab] = []; S.anim = "fade"; render(); window.scrollTo(0, 0); }
    else window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  go(() => { S.nav.tab = tab; }, "fade");
}
function openArticle(id) {
  S.nav.tab = "news";
  S.nav.stacks.news = [{ screen: "article", arg: id }];
  S.anim = "enter";
  render();
  window.scrollTo(0, 0);
}

let toastTimer = null;
function toast(msg) {
  const el = $("#toast");
  if (!el) return;
  el.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.innerHTML = ""; }, 3200);
}

function renderTopbar(scr, out) {
  const bar = $("#topbar");
  const root = !S.nav.stacks[S.nav.tab].length;
  const ro = !S.canWrite && S.core ? `<span class="ro-badge">Solo lectura</span>` : "";

    bar.innerHTML = `<button class="back-btn" data-act="back" aria-label="Atrás">${ICON.back}<span>Atrás</span></button>
<span class="title">${esc(out.title || "")}</span><span class="spacer"></span>${ro}${out.action || ""}`;

}
function renderTabbar() {
  const tb = $("#tabbar");
  tb.innerHTML = `<div class="in">${TABS.map((t) => `<button data-act="tab" data-arg="${t.id}" ${S.nav.tab === t.id ? 'aria-current="page"' : ""}>${ICON[t.icon]}<span>${t.label}</span></button>`).join("")}</div>`;
}
function renderFab(scr) {
  const fab = $("#fab");
  const show = S.core && S.canWrite && !S.nav.stacks[S.nav.tab].length;
  fab.hidden = !show;
  const photo = PHOTO();
  if (fab.dataset.photo !== String(photo)) {
    fab.dataset.photo = String(photo);

function uploadLabel(what) { return PHOTO() ? `${ICON.camera}Subir ${what}` : `${ICON.plus}Anotar ${what}`; }

function render() {
  const view = $("#view");
  if (!view) return;
  const scr = currentScreen();
  let out;
  try {
    if (!S.core) out = S.mode === "loading" || (S.mode === "db" && !S.loaded.core) ? loadingScreen() : emptyUniverse();
    else out = (SCREENS[scr.screen] || SCREENS.home)(scr.arg);
  } catch (err) {
    console.error(err);
    out = { html: `<div class="empty"><b>Esta pantalla ha fallado</b>Vuelve atrás o recarga la app. Tus datos no se han tocado.</div>`, title: "Error" };
  }
  renderTopbar(scr, out);
  view.className = "";
  if (S.anim) { void view.offsetWidth; view.className = S.anim; S.anim = null; }
  view.innerHTML = out.html;
  renderTabbar();
  renderFab(scr);
}

const EDITION = { es: "Edición especial", it: "Edizione speciale", en: "Special edition", pt: "Edição especial", fr: "Édition spéciale", nl: "Speciale editie" };
Object.assign(ICON, {
  heart: svg('<path d="M12 20s-7.5-4.6-7.5-10.2A4.1 4.1 0 0 1 12 7.4a4.1 4.1 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z"/>'),
  repost: svg('<path d="M7 7.5h10.5L15 5M17 16.5H6.5L9 19"/><path d="M4.5 13V10a2.5 2.5 0 0 1 2.5-2.5M19.5 11v3a2.5 2.5 0 0 1-2.5 2.5"/>'),
  reply: svg('<path d="M4.5 19V7a2.5 2.5 0 0 1 2.5-2.5h10A2.5 2.5 0 0 1 19.5 7v6.5A2.5 2.5 0 0 1 17 16H8.5z"/>')
});
const VERIFIED = `<svg class="vf" viewBox="0 0 24 24" aria-label="Cuenta verificada"><path fill="currentColor" d="M12 2l2.4 1.8 3-.2.9 2.9 2.5 1.7-1 2.8 1 2.8-2.5 1.7-.9 2.9-3-.2L12 22l-2.4-1.8-3 .2-.9-2.9-2.5-1.7 1-2.8-1-2.8 2.5-1.7.9-2.9 3 .2z"/><path d="M8.3 12.2l2.5 2.4 4.9-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const Likes = {
  set: null,
  load() { if (!this.set) { try { this.set = new Set(JSON.parse(localStorage.getItem("paddock.likes") || "[]")); } catch (e) { this.set = new Set(); } } return this.set; },
  has(k) { return this.load().has(k); },
  toggle(k) {
    const s = this.load();
    if (s.has(k)) s.delete(k); else s.add(k);
    try { localStorage.setItem("paddock.likes", JSON.stringify([...s].slice(-600))); } catch (e) { /* sin almacenamiento */ }
    return s.has(k);
  }
};

function initials(name) { return String(name || "?").split(/\s+/).filter(Boolean).map((w) => w[0]).join("").slice(0, 2).toUpperCase(); }
function jAvatar(m, s) { return `<span class="av" style="width:${s}px;height:${s}px;background:${m.accent};color:#fff">${esc(initials(m.journalist))}</span>`; }
function fanColor(h) { let x = 0; for (const ch of String(h)) x = (x * 31 + ch.charCodeAt(0)) % 360; return `hsl(${x} 55% 45%)`; }

function frontPage(a, i, big) {
  const f = a.frontPages[i];
  const m = MEDIA[f.outlet];
  const c = circuit(a.gp);
  const tid = f.focus && S.core ? teamOf(S.core, f.focus) : null;
  const fc = tid ? tcolor(tid) : "#8A8F98";
  const tag = big ? "div" : "button";
  return `<${tag} class="fp m-${m.mast}${big ? " big" : ""}" ${big ? "" : `data-act="open-fp" data-arg="${esc(a.id)}|${i}"`} style="--pa:${m.paper};--pi:${m.ink};--pc:${m.accent};--tc:${fc}" aria-label="Portada de ${esc(m.name)}: ${esc(f.headline)}">
<span class="fp-mast"><span class="fp-name">${esc(m.name)}</span><span class="fp-ed">${m.country} ${esc(EDITION[m.lang] || "")}</span></span>
<span class="fp-photo"><span class="fp-flag">${c ? c.flag : a.kind === "season" ? "🏆" : "🏁"}</span>${helmet(fc, big ? 112 : 58)}${f.focus ? `<span class="fp-cap">${esc(DRIVERS[f.focus].last)}</span>` : ""}</span>
<span class="fp-head${f.headline.length > 30 ? " long" : ""}">${esc(f.headline)}</span>${f.deck ? `<span class="fp-deck">${esc(f.deck)}</span>` : ""}</${tag}>`;
}
function kiosk(a) { return `<div class="kiosk">${a.frontPages.map((_, i) => frontPage(a, i)).join("")}</div>`; }

function postAuthor(p) {
  if (p.who === "driver" && DRIVERS[p.id]) {
    const t = S.core ? teamOf(S.core, p.id) : DRIVERS[p.id].team;
    return { name: fullName(p.id), sub: `Piloto de ${team(t).name}`, av: `<span class="av av-h" style="--tc:${tcolor(t)}">${helmet(tcolor(t), 30)}</span>`, vf: true, link: "driver:" + p.id };
  }
  if (p.who === "team" && TEAMS[p.id]) return { name: team(p.id).name, sub: "Cuenta oficial", av: `<span class="av av-c">${crest(p.id, 40)}</span>`, vf: true, link: "team:" + p.id };
  if (p.who === "journalist" && MEDIA[p.id]) { const m = MEDIA[p.id]; return { name: m.journalist, sub: `@${m.handle} en ${m.name}`, av: jAvatar(m, 42), vf: true, link: "media:" + p.id }; }
  const h = p.handle || "fan_f1";
  return { name: p.name || "Aficionado", sub: "@" + h, av: `<span class="av" style="width:42px;height:42px;background:${fanColor(h)};color:#fff">${esc(initials(p.name || h))}</span>`, vf: false, link: null };
}
function hashtags(t) { return esc(t).replace(/(^|[\s(])(#[\p{L}\p{N}_]+)/gu, '$1<span class="ht">$2</span>'); }
function socialPost(a, i, ctx) {
  const p = a.social[i];
  const au = postAuthor(p);
  const key = `${a.id}|${i}`;
  const liked = Likes.has(key);
  return `<article class="post">
${au.link ? `<button class="av-btn" data-act="push" data-arg="${esc(au.link)}" aria-label="${esc(au.name)}">${au.av}</button>` : `<span class="av-btn">${au.av}</span>`}
<div class="pb"><div class="ph"><b>${esc(au.name)}</b>${au.vf ? VERIFIED : ""}</div><div class="hd">${esc(au.sub)}</div>
<p>${hashtags(p.text)}</p>
${ctx ? `<button class="pctx" data-act="push" data-arg="article:${esc(a.id)}">${esc(ctx)}</button>` : ""}
<div class="pf"><span>${ICON.reply}${cfmt(p.replies)}</span><span>${ICON.repost}${cfmt(p.reposts)}</span>
<button class="like${liked ? " on" : ""}" data-act="like" data-arg="${esc(key)}" data-n="${p.likes}" aria-pressed="${liked}" aria-label="Me gusta">${ICON.heart}<span>${cfmt(p.likes + (liked ? 1 : 0))}</span></button></div></div></article>`;
}
function trendsBlock(list) {
  return `<div class="group trends">${list.map((t, i) => `<div class="trend"><span class="tn num">${i + 1}</span><span class="tt"><b>${esc(t.tag)}</b><small>${t.posts ? cfmt(t.posts) + " posts" : "Tendencia"}</small></span></div>`).join("")}</div>`;
}
function columnBlock(col) {
  const m = MEDIA[col.outlet] || MEDIA.cronometro;
  return `<div class="column" style="--pc:${m.accent}"><button class="col-by" data-act="push" data-arg="media:${col.outlet}">${jAvatar(m, 44)}<span><b>${esc(m.journalist)}</b><small>${m.country} ${esc(m.name)}${m.lang !== "es" ? ", traducido" : ""}</small></span></button>
<h3>${esc(col.title)}</h3>${paras(col.body)}</div>`;
}
function articleLabel(a) {
  const c = circuit(a.gp);
  const k = { previa: "Previa", quali: "Clasificación", race: "Carrera", sprint: "Sprint", season: "Cierre de temporada", flash: "Última hora" }[a.kind] || "Noticia";
  return a.kind === "season" ? `${k} ${a.season}` : `${k}${c ? " de " + c.name : ""}`;
}

/* ============================================================
   PANTALLAS
   ============================================================ */
function flKnown(rounds, d) { return rounds.some((rd) => { const x = resOf(rd, d); return !!x && (x.fl === true || x.fl === false); }); }
function inlineMd(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<i>$2</i>");
}
function paras(t) {
  return String(t || "").split(/\n+/).map((p) => p.trim()).filter(Boolean).map((p) => `<p>${inlineMd(p)}</p>`).join("");
}
function notFound(what) {
  return { title: what, html: `<div class="empty"><b>No encontrado</b>Puede que se haya borrado o que pertenezca a otra temporada.</div>` };
}
function staleBanner(core) {
  if (!core.stale) return "";
  return `<div class="banner">${ICON.info}<div style="flex:1">Faltan los puntos del resto de la parrilla tras la ronda ${core.stale.r}. Sincroniza con una foto del Mundial o edítalos a mano.
${S.canWrite ? `<div class="row-btns" style="margin-top:10px">${PHOTO() ? `<button class="btn btn-sm btn-red" data-act="upload" data-arg="standings">${ICON.camera}Foto del Mundial</button>` : ""}<button class="btn btn-sm ${PHOTO() ? "btn-ghost" : "btn-red"}" data-act="edit-standings">Editar puntos</button></div>` : ""}</div></div>`;
}

/* ---------- INICIO ---------- */
function heroPoster(core) {
  const nx = nextRound(core);
  if (!nx) {
    return `<section class="poster" style="--tc:#F2C14E"><span class="flag-bg">🏆</span>
<div class="kick"><span class="dot"></span>Temporada ${core.season} completada</div>
<h1 class="gp-name">Fin de temporada</h1><p class="gp-sub">Las ${core.totalRounds} carreras ya están en el archivo.</p>
${S.canWrite ? `<div class="cta" style="margin-top:16px"><button class="btn btn-red" data-act="close-season">${ICON.trophy}Cerrar la temporada ${core.season}</button></div>` : ""}</section>`;
  }
  const c = circuit(nx.gp);
  const q = !!nx.quali;
  const qMe = qOf(nx, ME);
  const previa = findArticle(core.season, nx.r, "previa");
  const cta = [];
  if (S.canWrite) {
    if (!c) cta.push(`<button class="btn btn-red" data-act="pick-circuit" data-arg="${nx.r}">${ICON.map}Elegir el circuito</button>`);
    else if (!q) cta.push(`<button class="btn btn-red" data-act="upload" data-arg="quali:${nx.r}">${uploadLabel("la clasificación")}</button>`);
    else cta.push(`<button class="btn btn-red" data-act="upload" data-arg="race:${nx.r}">${uploadLabel("la carrera")}</button>`);
  }
  if (previa) cta.push(`<button class="btn btn-ghost" data-act="push" data-arg="article:${esc(previa.id)}">Leer la previa</button>`);
  else if (c && S.canWrite && aiReady()) cta.push(`<button class="btn btn-ghost" data-act="gen-previa" data-arg="${nx.r}">${ICON.spark}Escribir la previa</button>`);
  return `<section class="poster" style="--tc:#7DD3FC"><span class="flag-bg">${c ? c.flag : "🏁"}</span>
<div class="kick"><span class="dot"></span>Próxima cita: ronda ${nx.r} de ${core.totalRounds}</div>
<h1 class="gp-name">${esc(c ? c.name : "Por anunciar")}</h1>
<p class="gp-sub">${c ? esc(c.track + ", " + c.place) : "Elige el circuito de esta ronda para empezar el fin de semana."}</p>
${c ? `<div class="sessions"><span class="sess${q ? " done" : ""}"><span class="ring"></span>${q ? (qMe ? `Clasificación: P${qMe}` : "Clasificación hecha") : "Clasificación"}</span><span class="sess"><span class="ring"></span>Carrera</span></div>` : ""}
${cta.length ? `<div class="cta"${c ? "" : ' style="margin-top:16px"'}>${cta.join("")}</div>` : ""}
${c ? `<div class="facts"><div><b>${fmt(c.km)}</b><span>km por vuelta</span></div><div><b>${c.laps}</b><span>vueltas</span></div><div><b>${c.turns}</b><span>curvas</span></div></div>` : ""}
</section>`;
}

function leaderCard(core) {
  const t = driverTable(core);
  const L = t[0], second = t[1];
  const d = drv(core, L.id);
  const tied = t.filter((r) => r.pos > 1 && r.pts === second.pts).map((r) => DRIVERS[r.id].last);
  const gap = L.pts - second.pts;
  if (!L.pts) {
    return `<div class="group leader">${helmet(tcolor(teamOf(core, ME)), 54)}<span class="who"><span class="dname"><span class="ln">Mundial a cero</span></span><small>Todavía no se ha disputado ninguna carrera</small></span></div>`;
  }
  const who = tied.length > 2 ? `${tied.length} pilotos` : tied.join(" y ");
  return `<button class="group leader" style="width:100%;text-align:left" data-act="push" data-arg="driver:${L.id}">
${helmet(tcolor(d.team), 54)}<span class="who">${dname(L.id)}<small>${esc(team(d.team).name)}</small></span>
<span class="pts"><b class="num">${fmt(L.pts)}</b><span>${gap > 0 ? `+${fmt(gap)} sobre ${esc(who)}` : `empatado con ${esc(who)}`}</span></span></button>`;
}

function duelCard(core, a, b) {
  a = a || ME;
  b = b || teammatesOf(core, a)[0];
  if (!b) return "";
  const pa = Number(core.standings[a] || 0), pb = Number(core.standings[b] || 0);
  const tot = pa + pb || 1;
  const h = headToHead(core.rounds, a, b);
  const sa = seasonStats(core, a), sb = seasonStats(core, b);
  const col = tcolor(teamOf(core, a));
  const row = (label, x, y) => `<span class="l num">${fmt(x)}</span><span class="m">${label}</span><span class="r num">${fmt(y)}</span>`;
  const known = h.q.a + h.q.b + h.r.a + h.r.b;
  const unk = known || a === ME ? h.q.unk + h.r.unk : 0;
  return `<div class="group duel">
<div class="duel-top"><button class="side" data-act="push" data-arg="driver:${a}" style="text-align:left">${dname(a)}<b class="num">${fmt(pa)}</b></button>
<button class="side r" data-act="push" data-arg="driver:${b}">${dname(b)}<b class="num">${fmt(pb)}</b></button></div>
<div class="duel-bar" aria-hidden="true"><i style="width:${(pa / tot) * 100}%;background:${col}"></i><i style="width:${(pb / tot) * 100}%;background:color-mix(in srgb, ${col} 35%, #6B7280)"></i></div>
<div class="duel-stats">${row("Clasificación", h.q.a, h.q.b)}${row("Carrera", h.r.a, h.r.b)}${row("Victorias", sa.wins, sb.wins)}${row("Poles", sa.poles, sb.poles)}${row("Podios", sa.podiums, sb.podiums)}</div>
${unk ? `<div class="duel-note">Cara a cara: ${plural(unk, "sesión", "sesiones")} sin datos suficientes para compararlos.</div>` : ""}</div>`;
}

function streakChips(core) {
  const c = careerStats(core, S.seasons, ME);
  const out = [];
  if (c.winStreak.cur >= 2) out.push(`<span class="chip hot"><b class="num">${c.winStreak.cur}</b>victorias seguidas</span>`);
  if (c.poleStreak.cur >= 2) out.push(`<span class="chip hot"><b class="num">${c.poleStreak.cur}</b>poles seguidas</span>`);
  if (c.podiumStreak.cur >= 2 && c.podiumStreak.cur > c.winStreak.cur) out.push(`<span class="chip"><b class="num">${c.podiumStreak.cur}</b>podios seguidos</span>`);
  if (c.pointsStreak.cur >= 3 && c.pointsStreak.cur > c.podiumStreak.cur) out.push(`<span class="chip"><b class="num">${c.pointsStreak.cur}</b>carreras seguidas en los puntos</span>`);
  if (c.allFinishedWon && c.wins >= 2) out.push(`<span class="chip blue">Ha ganado todas las carreras que ha terminado</span>`);
  if (c.winStreak.best > c.winStreak.cur && c.winStreak.best >= 2) out.push(`<span class="chip">Récord: <b class="num">${c.winStreak.best}</b>victorias seguidas</span>`);
  if (c.poleStreak.best > c.poleStreak.cur && c.poleStreak.best >= 2) out.push(`<span class="chip">Récord: <b class="num">${c.poleStreak.best}</b>poles seguidas</span>`);
  return out.join("");
}

function rivalryList(core, onlyWith) {
  const list = ((core.narrative && core.narrative.rivalries) || []).filter((x) => DRIVERS[x.a] && DRIVERS[x.b] && (!onlyWith || x.a === onlyWith || x.b === onlyWith));
  if (!list.length) return "";
  return `<div class="group">${list.map((x) => {
    const other = x.a === ME ? x.b : x.b === ME ? x.a : x.b;
    return `<button class="heat" style="width:100%;text-align:left" data-act="push" data-arg="driver:${other}">
<span class="nm"><b>${esc(shortName(x.a))} contra ${esc(shortName(x.b))}</b><small>${esc(x.note)}</small></span>
<span class="meter" role="img" aria-label="Tensión ${x.heat} de 100"><i style="width:${Math.max(4, x.heat)}%"></i></span></button>`;
  }).join("")}</div>`;
}

function homeScreen() {
  const core = S.core;
  const out = [heroPoster(core)];
  if (core.stale) out.push(`<div class="sec">${staleBanner(core)}</div>`);
  out.push(sec("Líder del Mundial", leaderCard(core)));
  const news = S.news.filter((a) => a.season === core.season).slice(0, 4);
  if (news.length) {
    out.push(sec("Última hora", coverCard(news[0]) + (news.length > 1 ? `<div class="group" style="margin-top:10px">${news.slice(1).map(newsRow).join("")}</div>` : ""),
      `<button class="link" data-act="tab" data-arg="news">Ver todas</button>`));
  }
  const kz = S.news.find((a) => (a.frontPages || []).length);
  if (kz) out.push(sec("En el quiosco", kiosk(kz), `<button class="link" data-act="goto-news" data-arg="kiosk">Quiosco</button>`));
  const t = driverTable(core);
  out.push(sec("Mundial de pilotos", `<div class="group">${t.slice(0, 5).map((r) => standRow(core, r, t[0].pts)).join("")}</div>`,
    `<button class="link" data-act="tab" data-arg="standings">Completo</button>`));
  const mate = teammatesOf(core, ME)[0];
  if (mate) out.push(sec(`Duelo en ${team(teamOf(core, ME)).short}`, duelCard(core, ME, mate)));
  const chips = streakChips(core);
  if (chips) out.push(sec("Rachas de Arévalo", `<div class="chips">${chips}</div>`));
  const riv = rivalryList(core);
  if (riv) out.push(sec("Rivalidades", riv));
  const sz = S.news.find((a) => (a.social || []).length);
  if (sz) {
    const top = sz.social.map((p, i) => [p.likes, i]).sort((x, y) => y[0] - x[0]).slice(0, 3).map(([, i]) => socialPost(sz, i));
    out.push(sec("Lo más comentado", `${(sz.trending || []).length ? `<div class="chips" style="margin-bottom:10px">${sz.trending.slice(0, 4).map((x) => `<span class="chip"><b>${esc(x.tag)}</b></span>`).join("")}</div>` : ""}<div class="group feed">${top.join("")}</div>`,
      `<button class="link" data-act="goto-news" data-arg="social">Redes</button>`));
  }
  return { html: out.join("") };
}

/* ---------- NOTICIAS ---------- */
function newsSegBar() {
  const seg = S.ui.newsSeg || "news";
  return `<div class="seg" role="tablist">${[["news", "Noticias"], ["kiosk", "Quiosco"], ["social", "Redes"], ["media", "Medios"]].map(([k, l]) => `<button data-act="seg" data-arg="newsSeg:${k}" aria-pressed="${seg === k}">${l}</button>`).join("")}</div>`;
}
function kioskBody() {
  const list = S.news.filter((a) => (a.frontPages || []).length);
  if (!list.length) return `<div class="empty"><b>El quiosco está vacío</b>Las portadas aparecerán con la próxima crónica.</div>`;
  const [first, ...rest] = list;
  return sec(`Hoy: ${articleLabel(first)}`, `<div class="fpgrid">${first.frontPages.map((_, i) => frontPage(first, i)).join("")}</div>`) +
    rest.slice(0, 15).map((a) => sec(articleLabel(a) + (a.season !== S.core.season ? `, temporada ${a.season}` : ""), kiosk(a))).join("");
}
function socialBody() {
  const f = S.ui.socialFilter || "all";
  const who = { all: null, driver: ["driver"], team: ["team"], journalist: ["journalist"], fan: ["fan"] }[f];
  const trendSrc = S.news.find((a) => (a.trending || []).length);
  const items = [];
  S.news.forEach((a) => (a.social || []).forEach((p, i) => { if (!who || who.includes(p.who)) items.push([a, i]); }));
  const filters = [["all", "Todo"], ["driver", "Pilotos"], ["team", "Escuderías"], ["journalist", "Prensa"], ["fan", "Afición"]];
  return `<div class="filters" role="toolbar" aria-label="Filtrar redes">${filters.map(([k, l]) => `<button data-act="seg" data-arg="socialFilter:${k}" aria-pressed="${f === k}">${l}</button>`).join("")}</div>
${trendSrc && f === "all" ? sec("Tendencias", trendsBlock(trendSrc.trending.slice(0, 5))) : ""}
${items.length ? sec("Lo último", `<div class="group feed">${items.slice(0, 80).map(([a, i]) => socialPost(a, i, articleLabel(a))).join("")}</div>`) : `<div class="empty"><b>Sin publicaciones</b>Las redes se llenarán con la próxima crónica.</div>`}`;
}
function mediaStats(id) {
  let fps = 0, cols = 0, posts = 0;
  S.news.forEach((a) => {
    fps += (a.frontPages || []).filter((f) => f.outlet === id).length;
    if (a.column && a.column.outlet === id) cols++;
    posts += (a.social || []).filter((p) => p.who === "journalist" && p.id === id).length;
  });
  return { fps, cols, posts };
}
function mediaBody() {
  return `<p class="lede" style="margin:0 0 12px">La prensa de tu universo. Cada medio tiene su país, su línea editorial y su periodista estrella.</p>
<div class="group">${MEDIA_IDS.map((id) => {
    const m = MEDIA[id];
    const st = mediaStats(id);
    return `<button class="mrow" data-act="push" data-arg="media:${id}"><span class="mmast m-${m.mast}" style="--pa:${m.paper};--pi:${m.ink};--pc:${m.accent}">${esc(m.name)}</span>
<span class="txt"><b>${m.country} ${esc(m.kind)}</b><small>${esc(m.journalist)}, ${plural(st.fps, "portada", "portadas")}</small></span>${ICON.chev}</button>`;
  }).join("")}</div>`;
}
function mediaScreen(id) {
  const m = MEDIA[id];
  if (!m) return notFound("Medio");
  const st = mediaStats(id);
  const out = [`<header class="mhero m-${m.mast}" style="--pa:${m.paper};--pi:${m.ink};--pc:${m.accent}"><span class="fp-ed">${m.country} ${esc(m.kind)}</span><h1 class="fp-name">${esc(m.name)}</h1>
<div class="mh-by">${jAvatar(m, 40)}<span><b>${esc(m.journalist)}</b><small>@${esc(m.handle)}</small></span></div></header>`];
  out.push(`<p class="lede" style="margin-top:12px"><b>Línea editorial:</b> ${esc(m.angle.charAt(0).toUpperCase() + m.angle.slice(1))}.</p>`);
  out.push(tiles([{ k: "Portadas", v: st.fps }, { k: "Columnas", v: st.cols }, { k: "Posts", v: st.posts }]));
  const fps = [];
  S.news.forEach((a) => (a.frontPages || []).forEach((f, i) => { if (f.outlet === id) fps.push(frontPage(a, i)); }));
  if (fps.length) out.push(sec("Sus portadas", `<div class="fpgrid">${fps.slice(0, 24).join("")}</div>`));
  const cols = S.news.filter((a) => a.column && a.column.outlet === id);
  if (cols.length) out.push(sec("Columnas", `<div class="group">${cols.map((a) => `<button class="list-btn" data-act="push" data-arg="article:${esc(a.id)}">✍️<span class="t">${esc(a.column.title)}<small>${esc(articleLabel(a))}</small></span>${ICON.chev}</button>`).join("")}</div>`));
  const posts = [];
  S.news.forEach((a) => (a.social || []).forEach((p, i) => { if (p.who === "journalist" && p.id === id) posts.push(socialPost(a, i, articleLabel(a))); }));
  if (posts.length) out.push(sec("En redes", `<div class="group feed">${posts.join("")}</div>`));
  return { title: m.name, html: out.join("") };
}

function newsScreen() {
  const seg = S.ui.newsSeg || "news";
  if (seg === "kiosk") return { html: newsSegBar() + kioskBody() };
  if (seg === "social") return { html: newsSegBar() + socialBody() };
  if (seg === "media") return { html: newsSegBar() + mediaBody() };
  const core = S.core;
  const f = S.ui.newsFilter;
  const kinds = { all: null, previa: ["previa"], quali: ["quali"], race: ["race", "sprint"], season: ["season"] };
  const list = S.news.filter((a) => !kinds[f] || kinds[f].includes(a.kind));
  const filters = [["all", "Todo"], ["previa", "Previas"], ["quali", "Clasificación"], ["race", "Carreras"], ["season", "Temporadas"]];
  const nx = nextRound(core);
  const c = nx && circuit(nx.gp);
  const cta = c && !findArticle(core.season, nx.r, "previa") && S.canWrite && aiReady()
    ? `<button class="group list-btn" style="margin-bottom:14px" data-act="gen-previa" data-arg="${nx.r}">${ICON.spark}<span class="t">Escribir la previa de ${esc(c.name)}<small>Contexto del Mundial, rivalidades, entrevistas y prensa.</small></span>${ICON.chev}</button>` : "";
  const body = list.length
    ? coverCard(list[0]) + (list.length > 1 ? `<div class="group" style="margin-top:10px">${list.slice(1).map(newsRow).join("")}</div>` : "")
    : `<div class="empty"><b>Sin noticias todavía</b>${f === "all" ? "Sube una clasificación o una carrera y la crónica aparecerá aquí." : "No hay noticias de este tipo."}</div>`;
  return {
    html: `${newsSegBar()}
<div class="filters" role="toolbar" aria-label="Filtrar noticias">${filters.map(([k, l]) => `<button data-act="news-filter" data-arg="${k}" aria-pressed="${f === k}">${l}</button>`).join("")}</div>
${cta}${body}`
  };
}

function statBox(st, kind) {
  if (!st || !st.me) return "";
  const m = st.me;
  const tl = [];
  if (m.pos) tl.push({ k: "Mundial", v: "P" + m.pos, cls: "hl" });
  tl.push({ k: "Puntos", v: fmt(m.pts) }, { k: "Carreras", v: m.races }, { k: "Victorias", v: m.wins, cls: "gold" }, { k: "Poles", v: m.poles }, { k: "Podios", v: m.podiums });
  if (m.p2 != null) tl.push({ k: "Segundos", v: m.p2 }, { k: "Terceros", v: m.p3 }, { k: "Abandonos", v: m.dnf });
  const chips = [];
  if (m.winStreak >= 2) chips.push(`<span class="chip hot"><b class="num">${m.winStreak}</b>victorias seguidas</span>`);
  if (m.poleStreak >= 2) chips.push(`<span class="chip hot"><b class="num">${m.poleStreak}</b>poles seguidas</span>`);
  const mrow = (x, name, color) => `<div class="mrow"><span class="p">${x.pos}</span><i style="background:${color}"></i><span class="n">${esc(name)}</span><span class="v">${fmt(x.pts)}</span></div>`;
  const drivers = (st.drivers || []).filter((x) => DRIVERS[x.id]);
  const teams = (st.teams || []).filter((x) => TEAMS[x.id]);
  return `<div class="statbox"><h3>${kind === "previa" ? "📊 Así llega Arévalo" : "📊 Actualización estadística"}</h3>${tiles(tl)}
${chips.length ? `<div class="chips" style="margin-top:12px">${chips.join("")}</div>` : ""}
${drivers.length ? `<div class="mini"><h4>Mundial de pilotos</h4>${drivers.map((x) => mrow(x, fullName(x.id), tcolor(DRIVERS[x.id].team))).join("")}</div>` : ""}
${teams.length ? `<div class="mini"><h4>Constructores</h4>${teams.map((x) => mrow(x, team(x.id).name, team(x.id).color)).join("")}</div>` : ""}
${st.stale ? `<p class="note">El Mundial del resto de la parrilla estaba pendiente de sincronizar.</p>` : ""}</div>`;
}

function speakerColor(q) {
  if (q.team && TEAMS[q.team]) return TEAMS[q.team].color;
  const hit = DRIVER_IDS.find((id) => q.speaker && q.speaker.toLowerCase().includes(DRIVERS[id].last.toLowerCase()));
  return hit ? tcolor(teamOf(S.core, hit)) : "var(--faint)";
}
function articleScreen(id) {
  const a = S.news.find((x) => x.id === id);
  if (!a) return notFound("Noticia");
  const c = circuit(a.gp);
  const parts = [];
  parts.push(`<header class="cover art-cover" style="--kc:${KIND_COLOR[a.kind] || "#E10600"}"><span class="flag-bg">${c ? c.flag : a.kind === "season" ? "🏆" : "🏁"}</span>
<span class="kicker">${esc(a.kicker)}</span><h1>${esc(a.title)}</h1>${a.subtitle ? `<p class="sub">${esc(a.subtitle)}</p>` : ""}<span class="meta">${esc(articleMeta(a))}</span></header>`);
  const body = [];
  (a.sections || []).forEach((s) => { body.push(`${s.heading ? `<h2>${esc(s.heading)}</h2>` : ""}${paras(s.body)}`); });
  if ((a.interviews || []).length) {
    body.push(`<h2>🎙️ Declaraciones</h2>` + a.interviews.map((q) => {
      const tn = q.team && TEAMS[q.team] ? TEAMS[q.team].name : "";
      const by = q.by && MEDIA[q.by] ? `${esc(MEDIA[q.by].journalist)} <span class="muted">(${esc(MEDIA[q.by].name)})</span>:` : "Periodista:";
      return `<div class="qa" style="--sc:${speakerColor(q)}">${q.q ? `<p class="q"><b>${by}</b> ${esc(q.q)}</p>` : ""}<div class="a"><div class="who">${q.team ? crest(q.team, 16) + " " : ""}${esc(q.speaker)}${tn ? ` <span>${esc(tn)}</span>` : ""}</div><p>${esc(q.a)}</p></div></div>`;
    }).join(""));
  }
  const fps = a.frontPages || [];
  if (fps.length) body.push(`<h2>🗞️ Las portadas</h2><p class="note" style="margin-top:0">Toca una portada para verla en grande.</p>${kiosk(a)}`);
  if ((a.headlines || []).length) body.push(`<h2>📰 ${fps.length ? "Más titulares" : "La prensa"}</h2><ul class="press">${a.headlines.map((h) => `<li>${esc(h)}</li>`).join("")}</ul>`);
  if (a.column && a.column.body) body.push(`<h2>✍️ La columna</h2>${columnBlock(a.column)}`);
  if ((a.social || []).length) {
    body.push(`<h2>📱 En redes</h2>${(a.trending || []).length ? `<div class="chips" style="margin-bottom:12px">${a.trending.map((t) => `<span class="chip"><b>${esc(t.tag)}</b>${t.posts ? cfmt(t.posts) : ""}</span>`).join("")}</div>` : ""}<div class="group feed">${a.social.map((_, i) => socialPost(a, i)).join("")}</div>`);
  }
  if ((a.radio || []).length) body.push(`<h2>📻 Radio paddock</h2><ul class="radio">${a.radio.map((h) => `<li>${inlineMd(h)}</li>`).join("")}</ul>`);
  body.push(statBox(a.stats, a.kind));
  const canRewrite = S.canWrite && aiReady() && a.r && S.core && a.season === S.core.season && ["previa", "quali", "race", "sprint"].includes(a.kind);
  if (S.canWrite) {
    body.push(`<div class="row-btns sec">${canRewrite ? `<button class="btn btn-ghost" data-act="art-rewrite" data-arg="${esc(a.id)}">${ICON.spark}Reescribir</button>` : ""}<button class="btn btn-danger" data-act="art-delete" data-arg="${esc(a.id)}">${ICON.trash}Borrar noticia</button></div>`);
  }
  if (a.r && S.core && a.season === S.core.season) body.push(`<div class="sec"><button class="group list-btn" data-act="goto-race" data-arg="${a.r}">${ICON.flag}<span class="t">Ver la ronda ${a.r}${c ? " en " + esc(c.name) : ""}<small>Resultados, podio y todas sus noticias</small></span>${ICON.chev}</button></div>`);
  parts.push(`<article class="art-body">${body.join("")}</article>`);
  return { title: a.kicker, html: parts.join("") };
}

/* ---------- CARRERAS ---------- */
function raceRow(core, round, who) {
  who = who || ME;
  const st = roundStatus(core, round);
  const c = circuit(round.gp);
  let right = "";
  if (st === "done") {
    const q = qOf(round, who), x = resOf(round, who);
    right = `<span class="badges">${q ? `<span class="badge q">Q${q}</span>` : ""}${x && x.fl ? '<span class="badge fl">VR</span>' : ""}${x ? posBadge(x) : '<span class="badge">?</span>'}</span>`;
  } else if (st === "next") right = `<span class="badge next">${round.quali ? "Falta la carrera" : "Próxima"}</span>`;
  else if (round.quali && qOf(round, who)) right = `<span class="badge q">Q${qOf(round, who)}</span>`;
  return `<button class="rrow ${st}" data-act="push" data-arg="race:${round.r}">
<span class="rn num">R${round.r}</span><span class="fl">${c ? c.flag : "🏁"}</span>
<span class="txt"><b>${esc(c ? c.name : "Por anunciar")}</b><small>${esc(c ? c.track : st === "tba" && S.canWrite ? "Toca para elegir el circuito" : "Circuito por anunciar")}</small></span>${right}</button>`;
}
function racesScreen() {
  const core = S.core;
  const done = doneRounds(core).length;
  return {
    html: `<div class="sec-h" style="margin-top:4px"><h2>Temporada ${core.season}</h2><span class="muted">${done} de ${core.totalRounds} carreras</span></div>
<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${core.totalRounds}" aria-valuenow="${done}"><i style="width:${(done / core.totalRounds) * 100}%"></i></div>
<div class="group">${core.rounds.map((rd) => raceRow(core, rd)).join("")}</div>`
  };
}

function podium(core, round, key) {
  const src = round[key || "race"];
  const by = {};
  Object.entries(src.res).forEach(([d, x]) => { if (finished(x) && x.pos <= 3) by[x.pos] = d; });
  const step = (p) => {
    const d = by[p];
    return `<div class="step s${p}${d ? "" : " unk"}"><div class="nm">${d ? `${esc(DRIVERS[d].last)}<small>${esc(team(teamOf(core, d)).short)}</small>` : "<small>Sin datos</small>"}</div><div class="blk">${p}</div></div>`;
  };
  return `<div class="podium">${step(2)}${step(1)}${step(3)}</div>`;
}
function resultsTable(core, src, mode) {
  let rows;
  if (mode === "quali") rows = Object.entries(src.res).map(([id, pos]) => ({ id, pos })).sort((a, b) => a.pos - b.pos);
  else rows = Object.entries(src.res).map(([id, x]) => Object.assign({ id }, x)).sort((a, b) => (a.pos ?? 99) - (b.pos ?? 99));
  return `<div class="group"><table class="rtable">${rows.map((r) => `<tr class="${r.id === ME ? "me" : ""}">
<td class="p">${r.pos != null ? r.pos : "—"}</td><td class="t"><i style="background:${tcolor(teamOf(core, r.id))}"></i></td>
<td><button data-act="push" data-arg="driver:${r.id}" style="text-align:left">${esc(fullName(r.id))}</button>${r.fl ? ' <span class="badge fl">VR</span>' : ""}</td>
<td class="x">${mode === "quali" ? "" : finished(r) ? (r.pts ? "+" + fmt(r.pts) : "") : esc(String(r.st || "").toUpperCase())}</td></tr>`).join("")}</table></div>`;
}
function raceScreen(arg) {
  const core = S.core;
  const round = roundOf(core, Number(arg));
  if (!round) return notFound("Carrera");
  const c = circuit(round.gp);
  const st = roundStatus(core, round);
  const out = [];
  const facts = c ? `<div class="facts"><div><b>${fmt(c.km)}</b><span>km por vuelta</span></div><div><b>${c.laps}</b><span>vueltas</span></div><div><b>${c.turns}</b><span>curvas</span></div></div>` : "";
  out.push(`<section class="poster" style="--tc:${st === "done" ? "#E10600" : "#7DD3FC"}"><span class="flag-bg">${c ? c.flag : "🏁"}</span>
<div class="kick">${st === "next" ? '<span class="dot"></span>' : ""}Ronda ${round.r} de ${core.totalRounds}${st === "done" ? ", disputada" : st === "next" ? ", la próxima" : ""}</div>
<h1 class="gp-name">${esc(c ? c.name : "Por anunciar")}</h1><p class="gp-sub">${c ? esc(c.track + ", " + c.place) : "Aún no se ha elegido el circuito."}</p>${facts}</section>`);
  if (c) out.push(`<p class="lede" style="margin-top:12px">${esc(c.note)}</p>`);

  if (S.canWrite) {
    const btns = [];
    if (!round.race) {
      if (!c) btns.push(`<button class="btn btn-red" data-act="pick-circuit" data-arg="${round.r}">${ICON.map}Elegir el circuito</button>`);
      else {
        btns.push(round.quali
          ? `<button class="btn btn-red" data-act="upload" data-arg="race:${round.r}">${uploadLabel("la carrera")}</button>`
          : `<button class="btn btn-red" data-act="upload" data-arg="quali:${round.r}">${uploadLabel("la clasificación")}</button>`);
        if (!findArticle(core.season, round.r, "previa") && aiReady()) btns.push(`<button class="btn btn-ghost" data-act="gen-previa" data-arg="${round.r}">${ICON.spark}Escribir la previa</button>`);
      }
    }
    if (btns.length) out.push(`<div class="row-btns" style="margin-top:14px">${btns.join("")}</div>`);
  }

  if (round.race || round.quali) {
    const x = resOf(round, ME), q = qOf(round, ME), g = gridOf(round, ME);
    const kv = [];
    if (q != null) kv.push(["Clasificación", q === 1 ? "Pole position" : "P" + q]);
    if (round.race && g != null && g !== q) kv.push(["Salida", "P" + g]);
    if (round.race) {
      kv.push(["Resultado", x ? (finished(x) ? "P" + x.pos : String(x.st).toUpperCase()) : "Sin dato"]);
      kv.push(["Vuelta rápida", x && x.fl === true ? "Sí" : x && x.fl === false ? "No" : "Sin dato"]);
      kv.push(["Puntos", x ? fmt(x.pts || 0) : "—"]);
    }
    const sp = sprintOf(round, ME);
    if (sp) kv.push(["Sprint", finished(sp) ? `P${sp.pos} (+${fmt(sp.pts || 0)})` : String(sp.st).toUpperCase()]);
    out.push(sec("Arévalo este fin de semana", `<div class="group kv">${kv.map(([k, v]) => `<div class="k">${esc(k)}</div><div class="v">${esc(v)}</div>`).join("")}</div>`));
  }
  if (round.race) {
    out.push(sec("Podio", podium(core, round)));
    const outs = Object.entries(round.race.res).filter(([, x]) => !finished(x));
    if (outs.length) out.push(sec("Abandonos", `<div class="chips">${outs.map(([d, x]) => `<button class="chip" data-act="push" data-arg="driver:${d}"><b>${esc(String(x.st).toUpperCase())}</b>${esc(fullName(d))}</button>`).join("")}</div>`));
    out.push(sec(round.race.full ? "Resultado completo" : "Resultados conocidos", resultsTable(core, round.race, "race")));
  }
  if (round.sprint) out.push(sec(round.sprint.full ? "Sprint completo" : "Sprint: resultados conocidos", resultsTable(core, round.sprint, "race")));
  if (round.quali && (round.quali.full || Object.keys(round.quali.res).length > 1)) out.push(sec(round.quali.full ? "Parrilla de clasificación" : "Clasificación: posiciones conocidas", resultsTable(core, round.quali, "quali")));
  const notes = [round.quali && round.quali.notes, round.race && round.race.notes].filter(Boolean);
  if (notes.length) out.push(sec("Notas del fin de semana", `<div class="group" style="padding:12px 14px">${notes.map((n) => `<p style="margin:0 0 8px">${esc(n)}</p>`).join("")}</div>`));

  if (S.canWrite && (round.race || round.quali)) {
    const fix = [];
    if (round.quali) fix.push(`<button class="btn btn-ghost btn-sm" data-act="edit-session" data-arg="quali:${round.r}">${ICON.edit}Corregir clasificación</button>`);
    if (round.race) fix.push(`<button class="btn btn-ghost btn-sm" data-act="edit-session" data-arg="race:${round.r}">${ICON.edit}Corregir carrera</button>`);
    if (c) fix.push(round.sprint
      ? `<button class="btn btn-ghost btn-sm" data-act="edit-session" data-arg="sprint:${round.r}">${ICON.edit}Corregir sprint</button>`
      : `<button class="btn btn-ghost btn-sm" data-act="upload" data-arg="sprint:${round.r}">${ICON.plus}Añadir sprint</button>`);
    if (!round.race) fix.push(`<button class="btn btn-ghost btn-sm" data-act="pick-circuit" data-arg="${round.r}">${ICON.map}Cambiar circuito</button>`);
    out.push(`<div class="row-btns sec">${fix.join("")}</div>`);
  }
  const arts = S.news.filter((a) => a.season === core.season && a.r === round.r);
  if (arts.length) out.push(sec("Noticias de esta ronda", `<div class="group">${arts.map(newsRow).join("")}</div>`));
  return { title: c ? c.gp : `Ronda ${round.r}`, html: out.join("") };
}

function myProfile(core) {
  const s = seasonStats(core, ME);
  const out = [];
  out.push(sec(`Temporada ${core.season}`, tiles([
    { k: "Mundial", v: "P" + driverPos(core, ME), cls: "hl" }, { k: "Puntos", v: fmt(s.pts) }, { k: "Carreras", v: s.races },
    { k: "Victorias", v: s.wins, cls: "gold" }, { k: "Poles", v: s.poles }, { k: "Podios", v: s.podiums },
    { k: "Segundos puestos", v: s.p2 }, { k: "Terceros puestos", v: s.p3 }, { k: "Abandonos", v: s.dnf },
    { k: "Vueltas rápidas", v: flKnown(core.rounds, ME) ? s.fl : "—" }, { k: "Mejor resultado", v: s.best ? "P" + s.best : "—" }, { k: "Carreras en puntos", v: s.pointsFinishes }
  ])));
  const chips = streakChips(core);
  if (chips) out.push(`<div class="chips" style="margin-top:12px">${chips}</div>`);
  const rounds = core.rounds.filter((rd) => rd.race || rd.quali);

  return out.join("");
}

function otherProfile(core, id) {
  const d = drv(core, id);
  const s = seasonStats(core, id);
  const out = [];
  out.push(sec(`Temporada ${core.season} en tu universo`, tiles([
    { k: "Mundial", v: "P" + driverPos(core, id), cls: "hl" }, { k: "Puntos", v: fmt(s.pts) }, { k: "Victorias", v: s.wins, cls: "gold" },
    { k: "Podios", v: s.podiums }, { k: "Poles", v: s.poles }, { k: "Abandonos", v: s.dnf }
  ]) + `<p class="note">Victorias, podios, poles y abandonos cuentan solo los resultados registrados en la app; los puntos son los oficiales.</p>`));
  const known = core.rounds.filter((rd) => resOf(rd, id) || qOf(rd, id) != null);
  if (known.length) out.push(sec("Resultados conocidos", `<div class="group">${known.map((rd) => raceRow(core, rd, id)).join("")}</div>`));
  const mate = teammatesOf(core, id)[0];
  if (teamOf(core, id) === teamOf(core, ME)) out.push(sec("Contra Arévalo", duelCard(core, ME, id)));
  else if (mate) out.push(sec("Contra su compañero", duelCard(core, id, mate)));
  const riv = rivalryList(core, id);
  if (riv) out.push(sec("Rivalidades", riv));
  if (d.real) {
    const r = d.real;
    out.push(sec(d.legend ? "Trayectoria en F1" : "Trayectoria real en F1", tiles([
      { k: "Mundiales", v: r.titles, cls: r.titles ? "gold" : "" }, { k: "Grandes Premios", v: r.gp }, { k: "Victorias", v: r.wins },
      { k: "Podios", v: r.podiums }, { k: "Poles", v: r.poles }, { k: "Vueltas rápidas", v: r.fl },
      { k: "Puntos", v: fmt(r.pts) }, { k: "Media por GP", v: r.gp ? fmt(r.pts / r.gp) : "—" },
      d.legend ? { k: "Tasa de victorias", v: r.gp ? Math.round((r.wins / r.gp) * 100) + "%" : "—" } : { k: "Debut", v: d.debut || "—" }
    ]) + `<p class="note">${d.legend ? "Su palmarés previo a tu universo." : REAL_STATS_SOURCE + ", según Wikipedia. Grandes Premios cuenta las salidas."}</p>`));
  }
  const u = universeTotals(core, S.seasons, id);
  if ((core.history || []).length) {
    out.push(sec("En tu universo (todas las temporadas)", tiles([
      { k: "Mundiales", v: u.titles, cls: u.titles ? "gold" : "" }, { k: "Victorias", v: u.wins }, { k: "Podios", v: u.podiums }
    ])));
  }
  return out.join("");
}

   HOJAS MODALES Y FLUJOS

let busyTimer = null;
function startBusy(msgs) {
  stopBusy();
  let i = 0;
  busyTimer = setInterval(() => { i = (i + 1) % msgs.length; const el = $("#busy-msg"); if (el) el.textContent = msgs[i]; }, 3200);
}
function stopBusy() { clearInterval(busyTimer); busyTimer = null; }

function openSheet(state) {
  if (S.sheet) cleanupSheet(S.sheet);
  S.sheet = state;
  S.sheetFresh = true;
  renderSheet();
}
function cleanupSheet(st) {
  stopBusy();
  if (st && st.ctl) { try { st.ctl.abort(); } catch (e) { /* ya abortada */ } }
  if (st && st.files) st.files.forEach((f) => { try { URL.revokeObjectURL(f.url); } catch (e) { /* nada */ } });
}
function closeSheet() {
  if (S.sheet) cleanupSheet(S.sheet);
  S.sheet = null;
  renderSheet();
}
function sheetBusy() { const st = S.sheet; return !!st && (st.step === "analyzing" || st.step === "writing" || (st.type === "working" && !st.error)); }

function renderSheet() {
  const root = $("#sheet-root");
  const st = S.sheet;
  if (!st) { root.innerHTML = ""; document.documentElement.style.overflow = ""; return; }
  const key = st.type + ":" + (st.step || "");
  const oldBody = root.querySelector(".sheet-b");
  const keep = oldBody && root.dataset.key === key ? oldBody.scrollTop : 0;
  const def = SHEETS[st.type](st);
  const anim = S.sheetFresh ? " anim" : "";
  S.sheetFresh = false;
  root.innerHTML = `<div class="sheet-back${anim}" data-act="sheet-backdrop"></div>
<div class="sheet${def.short ? " short" : ""}${anim}" role="dialog" aria-modal="true" aria-label="${esc(def.title)}">
<div class="sheet-h"><h3>${esc(def.title)}</h3>${def.steps || ""}<button class="icon-btn" data-act="sheet-close" aria-label="Cerrar">${ICON.x}</button></div>
<div class="sheet-b">${def.body}</div>${def.foot ? `<div class="sheet-f">${def.foot}</div>` : ""}</div>`;
  root.dataset.key = key;
  if (keep) root.querySelector(".sheet-b").scrollTop = keep;
  document.documentElement.style.overflow = "hidden";
}

function workingBody(title, msgs, error, retryAct, retryArg) {
  if (error) {
    return `<div class="working"><b>No se ha podido completar</b><p>${esc(error)}</p></div>`;
  }
  return `<div class="working"><div class="lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><b>${esc(title)}</b><p id="busy-msg" aria-live="polite">${esc(msgs[0])}</p></div>`;
}
function stepDots(n, of) { return `<span class="steps" aria-hidden="true">${Array.from({ length: of }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</span>`; }

const SESSION_LABEL = { quali: "Clasificación", race: "Carrera", sprint: "Sprint", standings: "Mundial de pilotos" };
const MATE = () => teammatesOf(S.core, ME)[0];

/* ---------- SUBIR SESIÓN ---------- */
function openUpload(arg) {
  const core = S.core;
  if (!core) return;
  const nx = nextRound(core);
  let session = "quali", r = nx ? nx.r : core.rounds.length;
  if (arg) {
    const [s, rr] = String(arg).split(":");
    session = s;
    if (rr) r = Number(rr);
  } else if (nx && nx.quali) session = "race";
  const round = roundOf(core, r);
  if (!PHOTO() && arg) {
    if (session === "standings") { ACTIONS["edit-standings"](); return; }
    if (round && round.gp) { openEntry({ session, r, gp: round.gp }); return; }
  }
  openSheet({
    type: "upload", step: arg && session !== "standings" && round && round.gp ? "photos" : arg === "standings" ? "photos" : "choose",
    session, r, gp: round ? round.gp : null, files: [], notes: "", rows: [], full: false, aiInfo: null,
    manual: { are: "", mate: "", fl: false, p1: "", p2: "", p3: "", dnfs: [] }, error: "", edit: false
  });
}

function openEdit(arg) {
  const [session, rr] = String(arg).split(":");
  const r = Number(rr);
  const round = roundOf(S.core, r);
  if (!round) return;
  let rows = [], full = false, notes = "";
  if (session === "quali" && round.quali) {
    rows = Object.entries(round.quali.res).map(([id, pos]) => ({ id, pos })).sort((a, b) => a.pos - b.pos);
    full = !!round.quali.full; notes = round.quali.notes || "";
  } else {
    const src = session === "sprint" ? round.sprint : round.race;
    if (src) {
      rows = Object.entries(src.res).map(([id, x]) => ({ id, pos: x.pos, st: x.st || "fin", fl: !!x.fl, pts: x.pts, grid: x.grid }))
        .sort((a, b) => (a.pos ?? 99) - (b.pos ?? 99));
      rows.forEach((row) => { if (row.pts == null || Number(row.pts) === autoPts({ session }, row)) row.pts = null; });
      full = !!src.full; notes = src.notes || "";
    }
  }
  openSheet({ type: "upload", step: "review", session, r, gp: round.gp, files: [], notes, rows, full, aiInfo: null, manual: null, error: "", edit: true });
}

function choiceBtn(st, key, title, sub) {
  return `<button data-act="u-session" data-arg="${key}" aria-pressed="${st.session === key}"><b>${title}</b><small>${sub}</small></button>`;
}
function roundOptions(st) {
  return S.core.rounds.map((rd) => `<option value="${rd.r}" ${rd.r === st.r ? "selected" : ""}>Ronda ${rd.r}: ${esc(roundName(rd))}${rd.race ? " (disputada)" : ""}</option>`).join("");
}
function circuitOptions(sel) {
  return `<option value="">Elige el circuito</option>` + CIRCUIT_IDS.map((k) => `<option value="${k}" ${sel === k ? "selected" : ""}>${CIRCUITS[k].flag} ${esc(CIRCUITS[k].name)}</option>`).join("");
}
function driverOptions(sel, exclude) {
  const ids = DRIVER_IDS.slice().sort((a, b) => DRIVERS[a].last.localeCompare(DRIVERS[b].last, "es"));
  return ids.filter((id) => !exclude || !exclude.includes(id) || id === sel)
    .map((id) => `<option value="${id}" ${sel === id ? "selected" : ""}>${esc(DRIVERS[id].last)}, ${esc(DRIVERS[id].first)} (${esc(team(teamOf(S.core, id)).short)})</option>`).join("");
}
function posOptions(sel, max, extra) {
  let o = extra || "";
  for (let i = 1; i <= max; i++) o += `<option value="${i}" ${String(sel) === String(i) ? "selected" : ""}>P${i}</option>`;
  return o;
}

function autoPts(st, row) {
  if (!row || row.st !== "fin") return 0;
  const table = st.session === "sprint" ? POINTS_SPRINT : POINTS_RACE;
  const p = Number(row.pos);
  return p >= 1 && p <= table.length ? table[p - 1] : 0;
}

function validate(st) {
  const errs = [], warns = [];
  const rows = st.rows;
  const ids = rows.map((r) => r.id).filter(Boolean);
  const dup = [...new Set(ids.filter((d, i) => ids.indexOf(d) !== i))];
  if (dup.length) errs.push(`${dup.map(fullName).join(", ")} aparece más de una vez.`);
  const unk = rows.filter((r) => !r.id).length;
  if (unk) warns.push(`${plural(unk, "fila", "filas")} sin piloto: se ignorarán al guardar.`);
  if (st.session === "standings") {
    const bad = rows.filter((r) => r.id && (r.pts === "" || r.pts == null || isNaN(Number(r.pts))));
    if (bad.length) errs.push(`Falta la puntuación de ${bad.map((r) => fullName(r.id)).join(", ")}.`);
    if (!ids.includes(ME)) warns.push("Arévalo no aparece: se mantienen sus puntos actuales.");
    if (ids.length && ids.length < DRIVER_IDS.length) warns.push(`Hay ${ids.length} de ${DRIVER_IDS.length} pilotos: los que falten conservan sus puntos.`);
    return { errs, warns };
  }
  if (!ids.includes(ME)) errs.push("Falta Arévalo en la tabla. Añádelo antes de guardar.");
  const isRace = st.session !== "quali";
  const ps = rows.filter((r) => r.id && (!isRace || (r.st || "fin") === "fin")).map((r) => Number(r.pos));
  if (ps.some((p) => !Number.isInteger(p) || p < 1 || p > DRIVER_IDS.length)) errs.push("Hay posiciones vacías o fuera de rango.");
  const dupP = [...new Set(ps.filter((p, i) => ps.indexOf(p) !== i))];
  if (dupP.length) errs.push(`Posición repetida: ${dupP.map((p) => "P" + p).join(", ")}.`);
  if (isRace && rows.filter((r) => r.fl).length > 1) errs.push("Solo puede haber una vuelta rápida.");
  if (st.full && ids.length < DRIVER_IDS.length) warns.push(`Está marcada como completa, pero hay ${ids.length} de ${DRIVER_IDS.length} pilotos.`);
  if (st.aiInfo && st.aiInfo.detected && SESSION_LABEL[st.aiInfo.detected] && st.aiInfo.detected !== st.session) {
    warns.push(`La foto parece de ${SESSION_LABEL[st.aiInfo.detected].toLowerCase()}, pero la estás guardando como ${SESSION_LABEL[st.session].toLowerCase()}.`);
  }
  return { errs, warns };
}

function reviewRow(st, row, i) {
  const isRace = st.session === "race" || st.session === "sprint";
  const me = row.id === ME ? " me" : "";
  const sel = `<select class="sel" data-bind="rows.${i}.id" data-rerender aria-label="Piloto de la fila ${i + 1}"><option value="">Sin identificar</option>${driverOptions(row.id)}</select>`;
  if (st.session === "standings") {
    return `<div class="rv${me}"><span class="num" style="text-align:center;font-weight:700;font-size:18px">${i + 1}</span>${sel}
<input class="inp pos-inp" inputmode="decimal" data-bind="rows.${i}.pts" value="${row.pts == null ? "" : esc(row.pts)}" aria-label="Puntos"></div>`;
  }
  const fin = (row.st || "fin") === "fin";
  const pos = `<input class="inp pos-inp" inputmode="numeric" data-bind="rows.${i}.pos" value="${fin && row.pos != null ? esc(row.pos) : ""}" ${fin ? "" : 'disabled placeholder="—"'} aria-label="Posición">`;
  if (!isRace) return `<div class="rv${me}">${pos}${sel}<button class="rm" data-act="u-rmrow" data-arg="${i}" aria-label="Quitar fila">${ICON.trash}</button></div>`;
  const stSel = `<select class="sel" data-bind="rows.${i}.st" data-rerender aria-label="Estado">${[["fin", "Terminó"], ["dnf", "DNF"], ["dsq", "DSQ"], ["dns", "DNS"]].map(([v, l]) => `<option value="${v}" ${(row.st || "fin") === v ? "selected" : ""}>${l}</option>`).join("")}</select>`;
  return `<div class="rv${me}">${pos}${sel}${stSel}<div class="opt">
<label><input type="radio" name="fl" data-act="u-fl" data-arg="${i}" ${row.fl ? "checked" : ""}> Vuelta rápida</label>
<label>Puntos <input class="inp" style="width:66px;min-height:34px;padding:4px 8px" inputmode="numeric" data-bind="rows.${i}.pts" value="${row.pts == null ? "" : esc(row.pts)}" placeholder="${autoPts(st, row)}"></label>
<button class="rm" data-act="u-rmrow" data-arg="${i}" aria-label="Quitar fila">${ICON.trash}</button></div></div>`;
}

function manualBody(st) {
  const m = st.manual;
  const mate = MATE();
  const max = DRIVER_IDS.length;
  if (st.session === "quali") {
    return `<div class="field"><label for="m-are">Posición de Arévalo</label><select id="m-are" class="sel" data-bind="manual.are"><option value="">Elige</option>${posOptions(m.are, max)}</select></div>
${mate ? `<div class="field"><label for="m-mate">Posición de ${esc(fullName(mate))}</label><select id="m-mate" class="sel" data-bind="manual.mate"><option value="">Sin dato</option>${posOptions(m.mate, max)}</select><small>Opcional, sirve para el cara a cara.</small></div>` : ""}
<div class="field"><label for="m-notes">Notas para la crónica</label><textarea id="m-notes" class="inp" data-bind="notes" placeholder="Ej.: la pole se decidió en la última vuelta de la Q3…">${esc(st.notes)}</textarea></div>`;
  }
  const fixed = {};
  if (m.are && m.are !== "dnf" && Number(m.are) <= 3) fixed[Number(m.are)] = ME;
  if (mate && m.mate && m.mate !== "dnf" && Number(m.mate) <= 3) fixed[Number(m.mate)] = mate;
  const slot = (p) => fixed[p]
    ? `<div class="inp" style="display:flex;align-items:center;gap:6px"><b>P${p}</b> ${esc(fullName(fixed[p]))}</div>`
    : `<select class="sel" data-bind="manual.p${p}" aria-label="P${p}"><option value="">P${p}: sin dato</option>${driverOptions(m["p" + p], [ME, mate])}</select>`;
  const others = DRIVER_IDS.filter((d) => d !== ME && d !== mate);

function manualRows(st) {
  const m = st.manual;
  const mate = MATE();
  const rows = [];
  const add = (id, pos, status) => {
    if (!id) return;
    const ex = rows.find((r) => r.id === id);
    if (ex) return;
    rows.push({ id, pos: pos == null ? null : Number(pos), st: status || "fin", fl: false, pts: null });
  };
  if (st.session === "quali") {
    add(ME, m.are);
    if (mate && m.mate) add(mate, m.mate);
    return rows;
  }
  if (m.are === "dnf") add(ME, null, "dnf"); else if (m.are) add(ME, m.are);
  const meRow = rows.find((r) => r.id === ME);
  if (meRow) meRow.fl = !!m.fl;
  if (mate && m.mate) { if (m.mate === "dnf") add(mate, null, "dnf"); else add(mate, m.mate); }
  [1, 2, 3].forEach((p) => { if (m["p" + p]) add(m["p" + p], p); });
  m.dnfs.forEach((d) => add(d, null, "dnf"));
  return rows;
}

async function addFiles(list) {
  const st = S.sheet;
  if (!st || st.type !== "upload") return;
  const max = S.aiMaxImages;
  for (const f of Array.from(list || [])) {
    if (st.files.length >= max) { toast(`Máximo ${max} fotos por análisis`); break; }
    let blob = f;
    if (!/^image\/(jpeg|png|webp|gif)$/i.test(f.type) || f.size > 15 * 1024 * 1024) blob = await toJpeg(f).catch(() => null);
    if (!blob) { toast(`No se ha podido leer ${f.name || "la foto"}. Prueba con JPG o PNG.`); continue; }
    st.files.push({ blob, url: URL.createObjectURL(blob) });
  }
  if (S.sheet === st) renderSheet();
}
function toJpeg(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.naturalWidth * k);
        cv.height = Math.round(img.naturalHeight * k);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        cv.toBlob((b) => { URL.revokeObjectURL(url); b ? resolve(b) : reject(new Error("toBlob")); }, "image/jpeg", 0.9);
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode")); };
    img.src = url;
  });
}

async function analyze() {
  const st = S.sheet;
  if (!st || !st.files.length) return;
  st.step = "analyzing";
  st.ctl = new AbortController();
  renderSheet();
  startBusy(AI_BUSY.extract);
  try {
    const out = await aiExtract(S.core, st.session, st.files.map((f) => f.blob), st.ctl.signal);
    if (S.sheet !== st) return;
    st.aiInfo = { confidence: out.confidence, notes: out.notes, detected: out.detected };
    if (st.session === "standings") st.rows = out.standings.map((x) => ({ id: x.id, pts: x.pts }));
    else {
      st.rows = out.rows.map((x) => ({ id: x.id, pos: x.pos, st: x.st || "fin", fl: !!x.fl, pts: x.pts, grid: x.grid }));
      if (st.session !== "quali") st.rows.forEach((row) => { if (row.pts == null || Number(row.pts) === autoPts(st, row)) row.pts = null; });
    }
    st.full = st.session !== "standings" && st.rows.filter((r) => r.id).length >= DRIVER_IDS.length - 2;
    if (!st.rows.length) { st.step = "error"; st.error = "No se ha encontrado ninguna tabla de resultados en las fotos. Prueba con otra foto más cercana o introdúcelos a mano."; }
    else st.step = "review";
  } catch (e) {
    if (S.sheet !== st) return;
    const msg = aiErrorText(e);
    if (msg === null) st.step = "photos";
    else { st.step = "error"; st.error = msg; }
  }
  stopBusy();
  renderSheet();
}

async function commitUpload(mode, rowsOverride) {
  const st = S.sheet;
  if (!st) return;
  if (!rowsOverride) {
    const v = validate(st);
    if (v.errs.length) { toast(v.errs[0]); return; }
  }
  const rows = (rowsOverride || st.rows).filter((r) => r.id);
  const core = clone(S.core);
  if (st.session === "standings") {
    const ordered = rows.map((r, i) => ({ id: r.id, pts: Number(r.pts), i })).sort((a, b) => b.pts - a.pts || a.i - b.i);
    applyStandings(core, ordered);
    S.core = core;
    try { await Store.saveCore(); } catch (e) { return; }
    closeSheet();
    toast("Mundial actualizado con los puntos oficiales");
    return;
  }
  const round = roundOf(core, st.r);
  if (!round.gp && st.gp) round.gp = st.gp;
  const full = !!st.full && !rowsOverride;
  if (st.session === "quali") {
    applyQuali(core, st.r, { res: Object.fromEntries(rows.map((r) => [r.id, Number(r.pos)])), full, notes: st.notes });
  } else {
    applyRace(core, st.r, {
      res: Object.fromEntries(rows.map((r) => [r.id, {
        pos: (r.st || "fin") === "fin" ? Number(r.pos) : null, st: r.st || "fin", fl: !!r.fl,
        pts: r.pts === "" || r.pts == null ? null : Number(r.pts), grid: r.grid == null || r.grid === "" ? null : Number(r.grid)
      }])), full, notes: st.notes
    }, st.session);
  }
  S.core = core;
  try { await Store.saveCore(); } catch (e) { return; }
  st.saved = true;
  const existing = findArticle(core.season, st.r, st.session);
  if (mode === "ai" && aiReady()) { await writeChronicle(st, existing && st.edit ? existing : null); return; }
  if (!aiReady() && !existing) {
    const art = templateArticle(S.core, roundOf(S.core, st.r), st.session);
    await Store.saveArticle(art).catch(() => null);
    closeSheet();
    openArticle(art.id);
    return;
  }
  closeSheet();
  toast(st.edit ? "Corrección guardada" : "Resultados guardados");
}

async function writeChronicle(st, replace) {
  st.step = "writing";
  st.ctl = new AbortController();
  renderSheet();
  startBusy(AI_BUSY.write);
  try {
    const raw = await aiWrite(S.core, roundOf(S.core, st.r), st.session, st.notes, st.ctl.signal);
    const core = clone(S.core);
    absorbNarrative(core, raw);
    S.core = core;
    const art = makeArticle(core, roundOf(core, st.r), st.session, raw, replace ? { id: replace.id, t: replace.t } : null);
    await Store.saveCore().catch(() => null);
    await Store.saveArticle(art);
    stopBusy();
    if (S.sheet === st) closeSheet();
    openArticle(art.id);
  } catch (e) {
    stopBusy();
    if (S.sheet !== st) return;
    const msg = aiErrorText(e);
    st.step = "error";
    st.error = msg || "Has detenido la redacción de la crónica.";
    renderSheet();
  }
}

async function runWriting(title, retry, job) {
  const st = { type: "working", title, msgs: AI_BUSY.write, ctl: new AbortController(), retry };

  startBusy(st.msgs);
  try {
    await job(st.ctl.signal);

    if (S.sheet === st) closeSheet();

    stopBusy();
    if (S.sheet !== st) return;

    st.error = msg;
    renderSheet();
  }

    openArticle(art.id);

function rewriteArticle(id) {

  const round = roundOf(S.core, a.r);

function confirmCloseSeason() {
  const core = S.core;
  const left = core.rounds.filter((x) => !x.race).length;
  openSheet({
    type: "confirm", title: `Cerrar la temporada ${core.season}`,
    text: `Se guardará la ficha histórica en el palmarés y empezará la temporada ${core.season + 1} con el Mundial a cero. ${left ? `Aún quedan ${plural(left, "carrera", "carreras")} sin disputar: se cerrará igualmente.` : ""}`,
    confirm: "Cerrar temporada", onConfirm: doCloseSeason
  });
}
async function doCloseSeason() {
  const core = S.core;
  const { seasonDoc, next, entry } = closeSeason(core);
  let narr = null;
  if (aiReady()) {
    const st = { type: "working", title: "Escribiendo el cierre de temporada", msgs: AI_BUSY.write, ctl: new AbortController() };
    openSheet(st);
    startBusy(st.msgs);
    try { narr = await aiSeason(core, entry, st.ctl.signal); }
    catch (e) {
      const msg = aiErrorText(e);
      stopBusy();
      if (msg === null) { closeSheet(); return; }
      toast(msg + " La temporada se cierra sin resumen.");
    }
    stopBusy();
  }
  const o = narr && typeof narr === "object" ? narr : {};
  const arr = (v) => (Array.isArray(v) ? v.map(String).slice(0, 12) : []);
  seasonDoc.narrative = narr ? { title: String(o.title || ""), subtitle: String(o.subtitle || ""), summary: String(o.summary || ""), keyMoments: arr(o.keyMoments), rivalriesSummary: arr(o.rivalriesSummary), controversies: arr(o.controversies) } : null;
  if (o.storyline) next.narrative.storyline = String(o.storyline).slice(0, 1500);
  const sections = [];
  if (o.summary) sections.push({ heading: "📜 La temporada", body: String(o.summary) });
  if (arr(o.keyMoments).length) sections.push({ heading: "⭐ Momentos clave", body: arr(o.keyMoments).map((x) => "• " + x).join("\n") });
  if (arr(o.rivalriesSummary).length) sections.push({ heading: "🔥 Rivalidades", body: arr(o.rivalriesSummary).map((x) => "• " + x).join("\n") });
  if (arr(o.controversies).length) sections.push({ heading: "⚠️ Polémicas", body: arr(o.controversies).map((x) => "• " + x).join("\n") });
  const title = entry.pos === 1 ? `¡ARÉVALO, CAMPEÓN DEL MUNDO EN LA TEMPORADA ${core.season}!` : `ARÉVALO CIERRA LA TEMPORADA ${core.season} EN LA POSICIÓN ${entry.pos}`;
  const art = makeArticle(core, null, "season", narr ? { kicker: "Fin de temporada", title: o.title || title, subtitle: o.subtitle || "", sections, headlines: o.headlines, frontPages: o.frontPages, social: o.social, trending: o.trending } : null,
    narr ? null : { title, subtitle: `${entry.wins} victorias, ${entry.poles} poles y ${entry.podiums} podios en ${entry.races} carreras.`, sections: [{ heading: "Resumen", body: `Terminó con ${fmt(entry.pts)} puntos. ${team(entry.team).name} acabó P${entry.teamPos} en constructores.` }] });
  try {
    await Store.saveSeason(seasonDoc);
    await Store.saveArticle(art);
    S.core = normalizeCore(next);
    await Store.saveCore();
  } catch (e) { return; }
  closeSheet();
  openArticle(art.id);
}

async function exportBackup() {
  if (!S.downloads || !S.core) return;
  const data = JSON.stringify({ app: "paddock", v: 1, exportedAt: new Date().toISOString(), core: S.core, news: S.news, seasons: S.seasons });
  try {
    await S.downloads.save({ filename: `paddock-universo-T${S.core.season}.json`, data });
    toast("Copia descargada");
  } catch (e) {
    if (e && e.code === "declined") return;
    if (e && ["unavailable", "not_granted", "capability_disabled"].includes(e.code)) { S.downloads = null; toast("Las descargas no están disponibles en esta vista."); }
    else toast("No se pudo descargar la copia.");
  }
}
function readRestoreFile(file) {
  if (!file || !S.sheet) return;
  const rd = new FileReader();
  rd.onload = () => { if (S.sheet && S.sheet.type === "restore") { S.sheet.text = String(rd.result || ""); S.sheet.error = ""; renderSheet(); } };
  rd.onerror = () => { if (S.sheet) { S.sheet.error = "No se pudo leer el archivo."; renderSheet(); } };
  rd.readAsText(file);
}
async function wipeRemote() {
  const ids = S.news.map((a) => a.id);
  const seasons = S.seasons.map((s) => s.season);
  for (const id of ids) await Store.remove("news/" + id).catch(() => null);
  for (const n of seasons) await Store.remove("seasons/s" + n).catch(() => null);
  S.news = [];
  S.seasons = [];
}
async function doRestore() {
  const st = S.sheet;
  let data;
  try { data = JSON.parse(st.text || ""); } catch (e) { st.error = "El contenido no es una copia válida."; renderSheet(); return; }
  const core = data && normalizeCore(data.core);
  if (!core || !Array.isArray(core.rounds)) { st.error = "Falta el universo en la copia."; renderSheet(); return; }
  const news = Array.isArray(data.news) ? data.news.filter((a) => a && a.id) : [];
  const seasons = Array.isArray(data.seasons) ? data.seasons.filter((s) => s && s.season) : [];
  openSheet({ type: "working", title: "Restaurando la copia", msgs: ["Guardando temporadas…", "Guardando noticias…", "Casi listo…"] });
  startBusy(["Guardando temporadas…", "Guardando noticias…", "Casi listo…"]);
  try {
    await wipeRemote();
    for (const s of seasons) await Store.saveSeason(s);
    for (const a of news) await Store.saveArticle(a);
    S.core = core;
    await Store.saveCore();
    stopBusy();
    closeSheet();
    toast("Copia restaurada");
    S.nav.stacks = { home: [], news: [], races: [], standings: [], paddock: [] };
    render();
  } catch (e) { stopBusy(); closeSheet(); }
}
function confirmReset() {
  openSheet({

    text: "Se borrarán todas las temporadas, resultados, noticias y el palmarés. Si quieres conservarlo, descarga antes una copia de seguridad.",
    confirm: "Borrar todo", onConfirm: async () => {

/* ============================================================
   ANOTAR RESULTADOS A MANO (torre de tiempos)
   Se tocan los pilotos en orden de llegada: el primero es P1.
   ============================================================ */
function PHOTO() { return aiReady() && !!S.aiImages; }
function entryFromRound(round, session) {
  const st = { order: [], out: [], fl: null, notes: "" };
  if (!round) return st;
  const order = [];
  if (session === "quali") {
    if (!round.quali) return st;
    Object.entries(round.quali.res).forEach(([id, p]) => { if (p >= 1) order[p - 1] = id; });
    st.notes = round.quali.notes || "";
  } else {
    const src = session === "sprint" ? round.sprint : round.race;
    if (!src) return st;
    Object.entries(src.res).forEach(([id, x]) => {
      if (finished(x)) order[x.pos - 1] = id; else st.out.push({ id, st: x.st || "dnf" });
      if (x.fl === true) st.fl = id;
    });
    st.notes = src.notes || "";
  }
  st.order = Array.from({ length: order.length }, (_, i) => order[i] || null);
  return st;
}
function openEntry(o) {
  const round = roundOf(S.core, o.r);
  const src = !round ? null : o.session === "quali" ? round.quali : o.session === "sprint" ? round.sprint : round.race;
  const base = entryFromRound(round, o.session);
  if (o.notes && !base.notes) base.notes = o.notes;
  openSheet(Object.assign({ type: "entry", session: o.session, r: o.r, gp: o.gp || (round && round.gp) || null, mode: "pos", target: null, edit: !!src }, base));
}
function entryStats(st) {
  const placed = st.order.filter(Boolean).length;
  const gaps = st.order.filter((x) => !x).length;
  const total = placed + st.out.length;
  return { placed, gaps, total, full: total === DRIVER_IDS.length && gaps === 0 };
}
function entryUsed(st) { return new Set(st.order.filter(Boolean).concat(st.out.map((o) => o.id))); }
function trimOrder(st) { while (st.order.length && !st.order[st.order.length - 1]) st.order.pop(); }
function entryValidate(st) {
  if (!st.order.filter(Boolean).length) return st.session === "quali" ? "Coloca al menos a un piloto." : "Coloca al menos a un piloto que terminara.";
  if (!entryUsed(st).has(ME)) return "Falta Arévalo.";
  return "";
}
function towerRow(st, id, i, table, race) {
  const p = i + 1;
  if (!id) {
    const on = st.target === i;
    return `<div class="trow gap${on ? " target" : ""}"><span class="tp num">${p}</span><button class="tgap" data-act="e-target" data-arg="${i}">${on ? "Elige arriba quién fue P" + p : "Sin anotar: toca para elegir"}</button><span class="tx"><button data-act="e-slot" data-arg="${i}" aria-label="Quitar el puesto ${p}">${ICON.x}</button></span></div>`;
  }
  const d = DRIVERS[id];
  const t = teamOf(S.core, id);
  const pts = table && p <= table.length ? table[p - 1] : 0;
  return `<div class="trow${p <= 3 ? " p" + p : ""}${id === ME ? " me" : ""}" style="--tc:${tcolor(t)}"><span class="tp num">${p}</span><span class="tb"></span>
<span class="tn"><b>${esc(d.code)}</b><small>${esc(d.last)}</small></span><span class="tx">${pts ? `<span class="tpts num">+${pts}</span>` : ""}
${race ? `<button class="flb${st.fl === id ? " on" : ""}" data-act="e-fl" data-arg="${i}" aria-label="Vuelta rápida de ${esc(d.last)}" aria-pressed="${st.fl === id}">${ICON.timer}</button>` : ""}
<button data-act="e-up" data-arg="${i}" aria-label="Subir un puesto" ${i === 0 ? "disabled" : ""}>${ICON.up}</button>
<button data-act="e-down" data-arg="${i}" aria-label="Bajar un puesto" ${i === st.order.length - 1 ? "disabled" : ""}>${ICON.down}</button>
<button data-act="e-slot" data-arg="${i}" aria-label="Quitar a ${esc(d.last)}">${ICON.x}</button></span></div>`;
}
function entrySheet(st) {
  const core = S.core;
  const round = roundOf(core, st.r);
  const c = circuit(st.gp);
  const race = st.session !== "quali";
  const k = entryStats(st);
  const used = entryUsed(st);
  const table = !race ? null : st.session === "sprint" ? POINTS_SPRINT : POINTS_RACE;
  const next = st.target != null ? st.target + 1 : st.order.length + 1;
  const pool = teamTable(core).flatMap((t) => teamDrivers(core, t.id)).filter((id) => !used.has(id));

  }).join("");
  let jump = "";

  }

    return `<div class="trow out" style="--tc:${tcolor(t)}"><span class="tp num">—</span><span class="tb"></span><span class="tn"><b>${esc(d.code)}</b><small>${esc(d.last)}</small></span>
<span class="tx"><button class="stc" data-act="e-outst" data-arg="${o.id}" aria-label="Cambiar motivo">${esc(o.st.toUpperCase())}</button><button data-act="e-outrm" data-arg="${o.id}" aria-label="Quitar a ${esc(d.last)}">${ICON.x}</button></span></div>`;
  }).join("");
  const hint = st.mode === "out" ? "Toca quién no terminó" : st.target != null ? `¿Quién fue P${st.target + 1}?` : `Toca quién fue P${next}`;
  const err = entryValidate(st);
  const note = err ? `<p class="note" style="margin:0 0 8px;color:var(--red)">${esc(err)}</p>`
    : `<p class="note" style="margin:0 0 8px">${!race ? (k.placed === DRIVER_IDS.length ? "Parrilla completa." : "Puedes guardar solo los puestos que sepas.") : k.full ? "Parrilla completa: se actualiza todo el Mundial." : "Sin todos los pilotos, el resto del Mundial quedará pendiente."}</p>`;
  return {
    title: `${st.edit ? "Corregir" : "Anotar"}: ${SESSION_LABEL[st.session].toLowerCase()}`,
    body: `<div class="entry-sum"><div><b>${esc(c ? c.flag + " " + c.name : "Ronda " + st.r)}</b><small>${last ? `Último: P${st.order.lastIndexOf(last) + 1} ${esc(DRIVERS[last].last)}` : `Ronda ${st.r} de ${core.totalRounds}`}</small></div>
<div class="es-count${k.full || (!race && k.placed === DRIVER_IDS.length) ? " ok" : ""}">${k.full || (!race && k.placed === DRIVER_IDS.length) ? "✓ Completa" : `${k.total}/${DRIVER_IDS.length}`}</div></div>
${race ? `<div class="seg seg-sm"><button data-act="e-mode" data-arg="pos" aria-pressed="${st.mode === "pos"}">🏁 Llegada</button><button data-act="e-mode" data-arg="out" aria-pressed="${st.mode === "out"}">🚫 Abandonos</button></div>` : ""}
${pool.length ? `<div class="pool-h"><span class="lbl">${hint}</span>${jump}</div><div class="pool">${chips}</div>` : `<div class="tip">✓ Están todos los pilotos.</div>`}
<div class="entry-tools">${race && round && round.quali && !st.order.length && !st.out.length ? `<button class="btn btn-ghost btn-sm" data-act="e-grid">${ICON.flag}Partir de la parrilla</button>` : ""}
${st.order.length || st.out.length ? `<button class="btn btn-ghost btn-sm" data-act="e-undo">${ICON.back}Deshacer</button><button class="btn btn-ghost btn-sm" data-act="e-reset">${ICON.trash}Vaciar</button>` : ""}</div>
${st.order.length ? `<h4 class="eh">${race ? "Clasificación final" : "Parrilla"}${race ? `<small>Toca ⏱ para la vuelta rápida</small>` : ""}</h4><div class="tower">${st.order.map((id, i) => towerRow(st, id, i, table, race)).join("")}</div>` : `<div class="tip">${race ? "Toca los pilotos en el orden en que cruzaron la meta: el primero será P1. Si solo sabes algunos puestos, usa «Saltar a»." : "Toca los pilotos en el orden de la parrilla: el primero será la pole."}</div>`}
${st.out.length ? `<h4 class="eh">No terminaron<small>Toca el motivo para cambiarlo</small></h4><div class="tower">${outs}</div>` : ""}
<div class="field" style="margin-top:18px"><label for="e-notes">Apuntes del fin de semana</label><textarea id="e-notes" class="inp" data-bind="notes" placeholder="Opcional: toques, sanciones, órdenes de equipo…">${esc(st.notes || "")}</textarea></div>`,
    foot: `${note}${aiReady()
      ? `<button class="btn btn-red btn-block" data-act="e-save" data-arg="ai" ${err ? "disabled" : ""}>${ICON.spark}Guardar y escribir la crónica</button><button class="btn btn-ghost btn-block" data-act="e-save" data-arg="plain" ${err ? "disabled" : ""}>Guardar sin crónica de IA</button>`
      : `<button class="btn btn-red btn-block" data-act="e-save" data-arg="plain" ${err ? "disabled" : ""}>Guardar resultados</button>`}`
  };
}
